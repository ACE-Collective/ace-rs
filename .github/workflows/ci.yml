# Formatting, lints, tests and the layering check on every push (PLAN.md 0.3 and 0.4), and
# the end-to-end test against the stack's images (2.30).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ace-yara links libmagic and checks its answers against the magic database the dev
      # image pins (PLAN.md 1.7), so every step runs in the dev image.
      - name: Build the dev image
        run: docker build -t ace4-dev:ci -t ace4-dev:latest docker/dev

      # ace-core's, ace-service's, ace-api's, ace-store's and ace-pool's tests need Postgres and the bucket, ace-pool's
      # telemetry test needs the telemetry profile's collector, and the sqlx check needs
      # Postgres; the Compose stack runs them. The steps that use them run in the stack's dev
      # service, which is the same image, so they reach them by service name.
      - name: Start Postgres, the bucket and the collector
        run: docker compose --profile telemetry up -d --wait postgres bucket collector

      - name: cargo fmt
        run: docker run --rm -v "$PWD:/workspace" -w /workspace ace4-dev:ci cargo fmt --all --check

      - name: cargo clippy
        run: docker run --rm -v "$PWD:/workspace" -w /workspace ace4-dev:ci cargo clippy --workspace --all-targets --locked -- -D warnings

      # nextest runs tests of different test programs at once; it doesn't run doctests.
      - name: cargo nextest
        run: docker compose run --rm -T -e CI=true dev cargo nextest run --workspace --locked

      - name: doctests
        run: docker compose run --rm -T -e CI=true dev cargo test --doc --workspace --locked

      # Fails when .sqlx/, the query data builds check queries against, doesn't match the
      # queries and the migrations. sqlx-cli needs a database even with --check, so this runs
      # against the stack's Postgres once the migrations are applied.
      - name: sqlx offline data
        run: docker compose run --rm -T dev sh -c 'cargo sqlx migrate run && cargo sqlx prepare --workspace --check'

      # Fails when ace-results, ace-api, ace-gui or ace-search depends on an ace-mod-* crate.
      - name: Layering check
        run: docker run --rm -v "$PWD:/workspace" -w /workspace ace4-dev:ci cargo run --locked --quiet -p ace-layering

  # PLAN.md 2.30: the end-to-end test, against the images docker/ace4/Dockerfile builds, under
  # a Compose project of its own. It makes its own signatures repository and replays recorded
  # RDAP and Splunk APIs, so it reaches nothing outside the runner.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: End-to-end test
        run: tests/e2e/run

      # The test enforces docs/acceptance.md's threshold over the tracked samples, and this keeps
      # the report; the local ones aren't in git, so a port is accepted on a run that has them
      - name: Keep the comparison's report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compare-report
          path: target/e2e/compare/

  # PLAN.md 4.8: each library against itself over the tracked samples, about 5 minutes. It needs
  # nothing up: its sides get a container each, and tests/e2e/run has only its self-test.
  library-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Each library on both sides
        run: tools/library-diff/run --all
        env:
          CI: "true"
