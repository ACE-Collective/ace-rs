# Formatting, lints, tests and the layering check on every push (PLAN.md 0.3 and 0.4).
#
# Two longer checks run by hand, not here: the end-to-end test (tests/e2e/run, make e2e), which needs
# an ace3 checkout for the scanner images, and the library diff (tools/library-diff/run), which
# compares a Python library with its Rust port when a port changes.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ace-yara links libmagic and checks its answers against the magic database the dev
      # image pins (PLAN.md 1.7), so every step runs in the dev image.
      # through Compose, which gives the build the vendor directory as its `vendor` context
      - name: Build the dev image
        run: docker compose build dev

      # ace-core's, ace-service's, ace-api's, ace-store's and ace-pool's tests need Postgres and the bucket, ace-pool's
      # telemetry test needs the telemetry profile's collector, and the sqlx check needs
      # Postgres; the Compose stack runs them. The steps that use them run in the stack's dev
      # service, which is the same image, so they reach them by service name.
      - name: Start Postgres, the bucket and the collector
        run: docker compose --profile telemetry up -d --wait postgres bucket collector

      - name: cargo fmt
        run: docker run --rm -v "$PWD:/workspace" -w /workspace ace-rs-dev:latest cargo fmt --all --check

      - name: cargo clippy
        run: docker run --rm -v "$PWD:/workspace" -w /workspace ace-rs-dev:latest cargo clippy --workspace --all-targets --locked -- -D warnings

      # nextest runs tests of different test programs at once; it doesn't run doctests.
      - name: cargo nextest
        run: docker compose run --rm -T -e CI=true dev cargo nextest run --workspace --locked --no-fail-fast

      - name: doctests
        run: docker compose run --rm -T -e CI=true dev cargo test --doc --workspace --locked

      # Fails when .sqlx/, the query data builds check queries against, doesn't match the
      # queries and the migrations. sqlx-cli needs a database even with --check, so this runs
      # against the stack's Postgres once the migrations are applied.
      - name: sqlx offline data
        run: docker compose run --rm -T dev sh -c 'cargo sqlx migrate run && cargo sqlx prepare --workspace --check'

      # Fails when ace-results, ace-api, ace-gui or ace-search depends on an ace-mod-* crate.
      - name: Layering check
        run: docker run --rm -v "$PWD:/workspace" -w /workspace ace-rs-dev:latest cargo run --locked --quiet -p ace-layering
