# Formatting, lints, tests and the layering check on every push (PLAN.md 0.3 and 0.4).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ace-yara links libmagic and checks its answers against the magic database the dev
      # image pins (PLAN.md 1.7), so every step runs in the dev image.
      - name: Build the dev image
        run: docker build -t ace4-dev:ci -t ace4-dev:latest docker/dev

      # ace-core's and ace-store's tests need Postgres and the bucket, and the sqlx check needs
      # Postgres; the Compose stack runs both. The steps that use them run in the stack's dev
      # service, which is the same image, so they reach them by service name.
      - name: Start Postgres and the bucket
        run: docker compose up -d --wait postgres bucket

      - name: cargo fmt
        run: docker run --rm -v "$PWD:/workspace" -w /workspace ace4-dev:ci cargo fmt --all --check

      - name: cargo clippy
        run: docker run --rm -v "$PWD:/workspace" -w /workspace ace4-dev:ci cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: docker compose run --rm -T -e CI=true dev cargo test --workspace --locked

      # Fails when .sqlx/, the query data builds check queries against, doesn't match the
      # queries and the migrations. sqlx-cli needs a database even with --check, so this runs
      # against the stack's Postgres once the migrations are applied.
      - name: sqlx offline data
        run: docker compose run --rm -T dev sh -c 'cargo sqlx migrate run && cargo sqlx prepare --workspace --check'

      # Fails when ace-results, ace-api, ace-gui or ace-search depends on an ace-mod-* crate.
      - name: Layering check
        run: docker run --rm -v "$PWD:/workspace" -w /workspace ace4-dev:ci cargo run --locked --quiet -p ace-layering
