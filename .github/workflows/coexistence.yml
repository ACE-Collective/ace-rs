# Checks that the Compose stack can still run beside ace3's (PLAN.md 0.6), on every change
# to a Compose file or to the check itself.
name: coexistence

on:
  push:
    paths:
      - "compose.yaml"
      - "compose.*.yaml"
      - "docker/**"
      - "bin/check-coexistence"
      - "tests/coexistence/**"
      - ".github/workflows/coexistence.yml"
  pull_request:
    paths:
      - "compose.yaml"
      - "compose.*.yaml"
      - "docker/**"
      - "bin/check-coexistence"
      - "tests/coexistence/**"
      - ".github/workflows/coexistence.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check compose.yaml
        run: bin/check-coexistence

      - name: Test the check
        run: tests/coexistence/run
