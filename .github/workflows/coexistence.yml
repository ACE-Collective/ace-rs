# Checks that the Compose stack can still run beside ace3's (PLAN.md 0.6), on every change
# to a Compose file or to the check itself.
name: coexistence

on:
  push:
    paths:
      - "compose.yaml"
      - "compose.*.yaml"
      - "docker/**"
      - "bin/check-coexistence"
      - "tests/coexistence/**"
      - ".github/workflows/coexistence.yml"
  pull_request:
    paths:
      - "compose.yaml"
      - "compose.*.yaml"
      - "docker/**"
      - "bin/check-coexistence"
      - "tests/coexistence/**"
      - ".github/workflows/coexistence.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The check reads compose.yaml uninterpolated, and the runner's Compose (v2.33 and older)
      # refuses a volume whose path is `${VAR:-default}` that way ("too many colons"). v2.40.3 and
      # later read it, so this pins the version the dev machines have.
      - name: Install Docker Compose v5.7.0
        run: |
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL -o ~/.docker/cli-plugins/docker-compose \
            https://github.com/docker/compose/releases/download/v5.7.0/docker-compose-linux-x86_64
          echo "7758048ad38e580f22559603312874fec8bb638d021a9e64182385fc17cc12a2  $HOME/.docker/cli-plugins/docker-compose" | sha256sum -c -
          chmod +x ~/.docker/cli-plugins/docker-compose
          docker compose version

      - name: Check compose.yaml
        run: bin/check-coexistence

      - name: Test the check
        run: tests/coexistence/run
