[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

# Every crate opts in with `[lints] workspace = true` in its own Cargo.toml.
[workspace.lints.rust]
# A dropped Result or other #[must_use] value fails the build.
unused_must_use = "deny"

[workspace.lints.clippy]
# `let _ = fallible();` hides a dropped error from unused_must_use, so clippy denies it too.
let_underscore_must_use = "deny"
