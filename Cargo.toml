[workspace]
resolver = "3"
members = ["crates/*"]
# Vendored crates build as dependencies, not members (vendor/README.md).
exclude = ["vendor/unrar_sys"]

# unrar_sys without RAR_SMP, so unrar unpacks RAR 5 on the calling thread (vendor/README.md).
[patch.crates-io]
unrar_sys = { path = "vendor/unrar_sys" }

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

# Every crate opts in with `[lints] workspace = true` in its own Cargo.toml.
[workspace.lints.rust]
# A dropped Result or other #[must_use] value fails the build.
unused_must_use = "deny"

[workspace.lints.clippy]
# `let _ = fallible();` hides a dropped error from unused_must_use, so clippy denies it too.
let_underscore_must_use = "deny"

# Dependencies build without debug info, and workspace crates keep line tables so a backtrace
# still names the file and line. With full debug info each test binary that links yara-x was
# about 390 MB, and stale copies of them filled the Docker VM's disk.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
