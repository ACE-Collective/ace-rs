[workspace]
resolver = "3"
members = ["crates/*"]
# Vendored crates build as dependencies, not members (vendor/README.md).
exclude = ["vendor/qpdf-sys", "vendor/unrar_sys"]

# qpdf-sys with bindings that compile on arm64 Linux (vendor/README.md).
[patch.crates-io]
qpdf-sys = { path = "vendor/qpdf-sys" }
# unrar_sys without RAR_SMP, so unrar unpacks RAR 5 on the calling thread (vendor/README.md).
unrar_sys = { path = "vendor/unrar_sys" }

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

# Every crate opts in with `[lints] workspace = true` in its own Cargo.toml.
[workspace.lints.rust]
# A dropped Result or other #[must_use] value fails the build.
unused_must_use = "deny"

[workspace.lints.clippy]
# `let _ = fallible();` hides a dropped error from unused_must_use, so clippy denies it too.
let_underscore_must_use = "deny"

# Dependencies build without debug info, and workspace crates keep line tables so a backtrace
# still names the file and line. With full debug info each test binary that links yara-x was
# about 390 MB, and stale copies of them filled the Docker VM's disk.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# A password's key derivation is 100,000 hashes and a module has a deadline, so these are optimized
# even where nothing else is, or the library diff and the module's tests time out.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.sha1]
opt-level = 3
[profile.dev.package.md-5]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.cbc]
opt-level = 3
[profile.dev.package.rc4]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.block-buffer]
opt-level = 3
[profile.dev.package.cipher]
opt-level = 3
[profile.dev.package.hybrid-array]
opt-level = 3

# A login hashes a password, and every test of one would otherwise take seconds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# urlfinderlib's port runs a crafted text against a 15-second deadline, and its tests run that text
# (crates/ace-mod-urls/tests/reference.rs), which unoptimized takes minutes. The IOC module's
# patterns run on the regex crates, which docs/measurements/url-extraction.md times in a dev build.
[profile.dev.package.ace-mod-urls]
opt-level = 3
[profile.dev.package.fancy-regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.ace-urlfinder]
opt-level = 3
[profile.dev.package.ace-pycompat]
opt-level = 3
[profile.dev.package.memchr]
opt-level = 3
[profile.dev.package.rustc-hash]
opt-level = 3

# file_type parses JavaScript with oxc in a contained task, whose main thread has an 8 MiB stack,
# and a nested file must parse within it (crates/ace-mod-files/src/javascript.rs). Unoptimized,
# oxc's frames are several times larger.
[profile.dev.package.oxc_parser]
opt-level = 3
[profile.dev.package.oxc_semantic]
opt-level = 3
[profile.dev.package.oxc_ast]
opt-level = 3
[profile.dev.package.oxc_ast_visit]
opt-level = 3
[profile.dev.package.oxc_regular_expression]
opt-level = 3
[profile.dev.package.oxc_allocator]
opt-level = 3
[profile.dev.package.oxc_syntax]
opt-level = 3
[profile.dev.package.oxc_span]
opt-level = 3
[profile.dev.package.oxc_ecmascript]
opt-level = 3

# dhash decodes an image as Pillow does, with libjpeg-turbo's decoder ported (crates/ace-dhash),
# which on a large image is slow unoptimized.
[profile.dev.package.ace-dhash]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
