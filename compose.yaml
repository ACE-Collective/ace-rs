# ace4's Compose stack. It runs on the same Docker host as ace3's stack, so it follows
# PLAN.md's "Running beside ace3": its own project name, ACE4_ variables, no fixed host
# port other than ACE4_PORT_HTTPS, ace4-* image names, no container_name, no explicitly
# named volume or network, and no fluentd log driver. bin/check-coexistence checks this file.
#
# Day to day:
#   docker compose up -d --wait        start the stack
#   docker compose exec dev bacon      rebuild on every save; `bacon clippy` or `bacon test` for other jobs
#   docker compose exec dev bash       a shell with the toolchain
#   docker compose down                stop it; the named volumes keep target/ and the caches
#   docker compose port postgres 5432  the host port Postgres was given, likewise bucket 8333
#
# Postgres and the bucket publish on ephemeral host ports bound to ACE4_BIND_ADDRESS, so they
# never take a port ace3 or another stack holds. Containers in the stack reach them by service
# name. Their credentials are dev defaults that ACE4_ variables override; none come from ace3.

name: ${ACE4_STACK:-ace4}

services:
  # Every other service waits for this one. COMPOSE_PROJECT_NAME overrides the name: above,
  # and the stack's containers, network and volumes would then follow it instead of
  # ACE4_STACK, so the guard refuses to let the stack start under any other project name.
  # Compose sets COMPOSE_PROJECT_NAME for interpolation to the project name in use.
  stack-guard:
    image: alpine:3.24.2
    environment:
      ACE4_STACK: ${ACE4_STACK:-ace4}
      PROJECT_IN_USE: ${COMPOSE_PROJECT_NAME}
    command:
      - sh
      - -c
      - |
        if [ "$$PROJECT_IN_USE" != "$$ACE4_STACK" ]; then
          echo "FATAL: the Compose project is '$$PROJECT_IN_USE', but ACE4_STACK is '$$ACE4_STACK'." >&2
          echo "       unset COMPOSE_PROJECT_NAME and set ACE4_STACK to pick the project name." >&2
          exit 1
        fi
    restart: "no"

  dev:
    build:
      context: docker/dev
    image: ace4-dev:latest
    depends_on:
      stack-guard:
        condition: service_completed_successfully
    init: true
    environment:
      # Tests, `cargo sqlx migrate run` and `cargo sqlx prepare --workspace` reach the stack's
      # Postgres through this (sqlx.toml names it). Builds don't read it: with no DATABASE_URL
      # set, sqlx checks queries against the offline data in .sqlx/.
      ACE4_DATABASE_URL: postgres://${ACE4_POSTGRES_USER:-ace4}:${ACE4_POSTGRES_PASSWORD:-ace4-dev-password}@postgres:5432/${ACE4_POSTGRES_DB:-ace4}
      # The stack's bucket, for ace-store's and ace-core's tests.
      ACE4_BUCKET_ENDPOINT: http://bucket:8333
      ACE4_BUCKET_NAME: ${ACE4_BUCKET_NAME:-ace4}
      ACE4_BUCKET_ACCESS_KEY: ${ACE4_BUCKET_ACCESS_KEY:-ace4-dev}
      ACE4_BUCKET_SECRET_KEY: ${ACE4_BUCKET_SECRET_KEY:-ace4-dev-secret}
      # A Docker client with proxies in its config.json gives every container ALL_PROXY and a
      # NO_PROXY list that doesn't name this stack's services, and the S3 client honors them.
      # The stack's own services are reached directly; anything else still goes through the
      # proxy, if there is one.
      NO_PROXY: localhost,127.0.0.1,postgres,bucket,collector
      no_proxy: localhost,127.0.0.1,postgres,bucket,collector
      # The telemetry profile's collector, for ace-pool's telemetry test: where it sends spans
      # and where it reads them back. Processes export spans only when ACE4_OTLP_ENDPOINT is
      # set, which it isn't here, so nothing else in the container tries to reach a collector
      # that isn't running.
      ACE4_TEST_OTLP_ENDPOINT: http://collector:4318
      ACE4_TEST_TRACES_URL: http://collector:16686
    # The image's main process, poll-host-changes, passes saves on the macOS host to
    # inotify in the container so bacon sees them. Rancher Desktop's virtiofs mount
    # doesn't, so without it bacon only rebuilds for changes made inside the container.
    working_dir: /workspace
    volumes:
      - .:/workspace
      # target/ lives on a named volume, not the macOS bind mount.
      - target:/workspace/target
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - sccache:/sccache
    mem_limit: ${ACE4_DEV_MEM_LIMIT:-12g}
    healthcheck:
      # Healthy when the checkout is mounted, the toolchain runs and the poller finished a
      # pass in the last 10 seconds.
      test:
        - CMD-SHELL
        - >-
          test -f /workspace/Cargo.toml
          && cargo --version >/dev/null
          && test -n "$$(find /tmp/poll-host-changes/last -newermt '-10 seconds')"
      interval: 15s
      timeout: 10s
      start_period: 10s
      retries: 3

  postgres:
    image: postgres:18.6-alpine3.24
    depends_on:
      stack-guard:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${ACE4_POSTGRES_USER:-ace4}
      POSTGRES_PASSWORD: ${ACE4_POSTGRES_PASSWORD:-ace4-dev-password}
      POSTGRES_DB: ${ACE4_POSTGRES_DB:-ace4}
    ports:
      - "${ACE4_BIND_ADDRESS:-127.0.0.1}::5432"
    volumes:
      # Postgres 18's image keeps its data under /var/lib/postgresql/18/, so the volume goes on
      # the parent directory and a major upgrade can sit beside the old data.
      - postgres-data:/var/lib/postgresql
    mem_limit: ${ACE4_POSTGRES_MEM_LIMIT:-1g}
    healthcheck:
      # Over TCP, because during first-start initialization the image's temporary server
      # listens only on the Unix socket, and pg_isready on the socket would pass too early.
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 5

  # The S3-compatible bucket for dev. MinIO's maintainers stopped publishing the community
  # edition's images in October 2025 and archived the repository in 2026, so dev runs
  # SeaweedFS instead. `weed mini` is one process with the S3 gateway, and it creates the
  # bucket and its one access key from these variables when it starts.
  bucket:
    image: chrislusf/seaweedfs:4.48
    depends_on:
      stack-guard:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: ${ACE4_BUCKET_ACCESS_KEY:-ace4-dev}
      AWS_SECRET_ACCESS_KEY: ${ACE4_BUCKET_SECRET_KEY:-ace4-dev-secret}
      S3_BUCKET: ${ACE4_BUCKET_NAME:-ace4}
    ports:
      - "${ACE4_BIND_ADDRESS:-127.0.0.1}::8333"
    volumes:
      - bucket-data:/data
    mem_limit: ${ACE4_BUCKET_MEM_LIMIT:-1g}
    healthcheck:
      # Healthy when the S3 gateway answers and the filer holds the bucket's directory.
      test:
        - CMD-SHELL
        - >-
          curl -sf -o /dev/null http://127.0.0.1:8333/healthz
          && curl -sf -o /dev/null "http://127.0.0.1:8888/buckets/$$S3_BUCKET/"
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 5

  # The trace collector (PLAN.md 2.22): Jaeger, which takes OpenTelemetry's OTLP and keeps
  # spans in memory, with a query API and a UI on 16686. Off by default; start it with
  # `docker compose --profile telemetry up -d --wait collector`, and processes that have
  # ACE4_OTLP_ENDPOINT set export their spans to it.
  collector:
    image: jaegertracing/jaeger:2.22.0
    profiles: [telemetry]
    depends_on:
      stack-guard:
        condition: service_completed_successfully
    environment:
      # see the dev service: the Docker client may give containers a proxy
      NO_PROXY: localhost,127.0.0.1,postgres,bucket,collector
      no_proxy: localhost,127.0.0.1,postgres,bucket,collector
    ports:
      # the UI and query API, and OTLP over HTTP
      - "${ACE4_BIND_ADDRESS:-127.0.0.1}::16686"
      - "${ACE4_BIND_ADDRESS:-127.0.0.1}::4318"
    mem_limit: ${ACE4_COLLECTOR_MEM_LIMIT:-512m}
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:13133/status
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  postgres-data:
  bucket-data:
  target:
  cargo-registry:
  cargo-git:
  sccache:
