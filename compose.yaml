# ace4's Compose stack. It runs on the same Docker host as ace3's stack, so it follows
# PLAN.md's "Running beside ace3": its own project name, ACE4_ variables, no fixed host
# port other than ACE4_PORT_HTTPS, ace4-* image names, no container_name, no explicitly
# named volume or network, and no fluentd log driver. bin/check-coexistence checks this file.
#
# Day to day:
#   docker compose up -d --wait        start the stack
#   docker compose exec dev bacon      rebuild on every save; `bacon clippy` or `bacon test` for other jobs
#   docker compose exec dev bash       a shell with the toolchain
#   docker compose down                stop it; the named volumes keep target/ and the caches
#   docker compose port postgres 5432  the host port Postgres was given, likewise bucket 8333
#
# Postgres and the bucket publish on ephemeral host ports bound to ACE4_BIND_ADDRESS, so they
# never take a port ace3 or another stack holds. Containers in the stack reach them by service
# name. Their credentials are dev defaults that ACE4_ variables override; none come from ace3.

name: ${ACE4_STACK:-ace4}

services:
  # Every other service waits for this one. COMPOSE_PROJECT_NAME overrides the name: above,
  # and the stack's containers, network and volumes would then follow it instead of
  # ACE4_STACK, so the guard refuses to let the stack start under any other project name.
  # Compose sets COMPOSE_PROJECT_NAME for interpolation to the project name in use.
  stack-guard:
    image: alpine:3.24.2
    environment:
      ACE4_STACK: ${ACE4_STACK:-ace4}
      PROJECT_IN_USE: ${COMPOSE_PROJECT_NAME}
    command:
      - sh
      - -c
      - |
        if [ "$$PROJECT_IN_USE" != "$$ACE4_STACK" ]; then
          echo "FATAL: the Compose project is '$$PROJECT_IN_USE', but ACE4_STACK is '$$ACE4_STACK'." >&2
          echo "       unset COMPOSE_PROJECT_NAME and set ACE4_STACK to pick the project name." >&2
          exit 1
        fi
    restart: "no"

  dev:
    build:
      context: docker/dev
      # unautoit's source, which the image builds as the sandbox image does
      additional_contexts:
        vendor: ./vendor
    image: ace4-dev:latest
    depends_on:
      stack-guard:
        condition: service_completed_successfully
    init: true
    environment:
      # Tests, `cargo sqlx migrate run` and `cargo sqlx prepare --workspace` reach the stack's
      # Postgres through this (sqlx.toml names it). Builds don't read it: with no DATABASE_URL
      # set, sqlx checks queries against the offline data in .sqlx/.
      ACE4_DATABASE_URL: postgres://${ACE4_POSTGRES_USER:-ace4}:${ACE4_POSTGRES_PASSWORD:-ace4-dev-password}@postgres:5432/${ACE4_POSTGRES_DB:-ace4}
      # The stack's bucket, for ace-store's and ace-core's tests.
      ACE4_BUCKET_ENDPOINT: http://bucket:8333
      ACE4_BUCKET_NAME: ${ACE4_BUCKET_NAME:-ace4}
      ACE4_BUCKET_ACCESS_KEY: ${ACE4_BUCKET_ACCESS_KEY:-ace4-dev}
      ACE4_BUCKET_SECRET_KEY: ${ACE4_BUCKET_SECRET_KEY:-ace4-dev-secret}
      # A Docker client with proxies in its config.json gives every container ALL_PROXY and a
      # NO_PROXY list that doesn't name this stack's services, and the S3 client honors them.
      # The stack's own services are reached directly; anything else still goes through the
      # proxy, if there is one.
      NO_PROXY: localhost,127.0.0.1,postgres,bucket,collector
      no_proxy: localhost,127.0.0.1,postgres,bucket,collector
      # The telemetry profile's collector, for ace-pool's telemetry test: where it sends spans
      # and where it reads them back. Processes export spans only when ACE4_OTLP_ENDPOINT is
      # set, which it isn't here, so nothing else in the container tries to reach a collector
      # that isn't running.
      ACE4_TEST_OTLP_ENDPOINT: http://collector:4318
      ACE4_TEST_TRACES_URL: http://collector:16686
    # The image's main process, poll-host-changes, passes saves on the macOS host to
    # inotify in the container so bacon sees them. Rancher Desktop's virtiofs mount
    # doesn't, so without it bacon only rebuilds for changes made inside the container.
    working_dir: /workspace
    volumes:
      - .:/workspace
      # target/ lives on a named volume, not the macOS bind mount.
      - target:/workspace/target
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - sccache:/sccache
    mem_limit: ${ACE4_DEV_MEM_LIMIT:-12g}
    healthcheck:
      # Healthy when the checkout is mounted, the toolchain runs and the poller finished a
      # pass in the last 10 seconds.
      test:
        - CMD-SHELL
        - >-
          test -f /workspace/Cargo.toml
          && cargo --version >/dev/null
          && test -n "$$(find /tmp/poll-host-changes/last -newermt '-10 seconds')"
      interval: 15s
      timeout: 10s
      start_period: 10s
      retries: 3

  # Postgres with pgvector (PLAN.md 7.11), which the search index's embeddings are kept in:
  # docker/postgres/Dockerfile builds the extension onto the pinned Postgres image.
  postgres:
    build:
      context: docker/postgres
    image: ace4-postgres:18.6-pgvector0.8.7
    depends_on:
      stack-guard:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${ACE4_POSTGRES_USER:-ace4}
      POSTGRES_PASSWORD: ${ACE4_POSTGRES_PASSWORD:-ace4-dev-password}
      POSTGRES_DB: ${ACE4_POSTGRES_DB:-ace4}
    ports:
      - "${ACE4_BIND_ADDRESS:-127.0.0.1}::5432"
    volumes:
      # Postgres 18's image keeps its data under /var/lib/postgresql/18/, so the volume goes on
      # the parent directory and a major upgrade can sit beside the old data.
      - postgres-data:/var/lib/postgresql
    mem_limit: ${ACE4_POSTGRES_MEM_LIMIT:-1g}
    healthcheck:
      # Over TCP, because during first-start initialization the image's temporary server
      # listens only on the Unix socket, and pg_isready on the socket would pass too early.
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 5

  # The S3-compatible bucket for dev. MinIO's maintainers stopped publishing the community
  # edition's images in October 2025 and archived the repository in 2026, so dev runs
  # SeaweedFS instead. `weed mini` is one process with the S3 gateway, and it creates the
  # bucket and its one access key from these variables when it starts.
  bucket:
    image: chrislusf/seaweedfs:4.48
    depends_on:
      stack-guard:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: ${ACE4_BUCKET_ACCESS_KEY:-ace4-dev}
      AWS_SECRET_ACCESS_KEY: ${ACE4_BUCKET_SECRET_KEY:-ace4-dev-secret}
      S3_BUCKET: ${ACE4_BUCKET_NAME:-ace4}
    ports:
      - "${ACE4_BIND_ADDRESS:-127.0.0.1}::8333"
    volumes:
      - bucket-data:/data
    mem_limit: ${ACE4_BUCKET_MEM_LIMIT:-1g}
    healthcheck:
      # Healthy when the S3 gateway answers and the filer holds the bucket's directory.
      test:
        - CMD-SHELL
        - >-
          curl -sf -o /dev/null http://127.0.0.1:8333/healthz
          && curl -sf -o /dev/null "http://127.0.0.1:8888/buckets/$$S3_BUCKET/"
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 5

  # The trace collector (PLAN.md 2.22): Jaeger, which takes OpenTelemetry's OTLP and keeps
  # spans in memory, with a query API and a UI on 16686. Off by default; start it with
  # `docker compose --profile telemetry up -d --wait collector`, and processes that have
  # ACE4_OTLP_ENDPOINT set export their spans to it.
  collector:
    image: jaegertracing/jaeger:2.22.0
    profiles: [telemetry]
    depends_on:
      stack-guard:
        condition: service_completed_successfully
    environment:
      # see the dev service: the Docker client may give containers a proxy
      NO_PROXY: localhost,127.0.0.1,postgres,bucket,collector
      no_proxy: localhost,127.0.0.1,postgres,bucket,collector
    ports:
      # the UI and query API, and OTLP over HTTP
      - "${ACE4_BIND_ADDRESS:-127.0.0.1}::16686"
      - "${ACE4_BIND_ADDRESS:-127.0.0.1}::4318"
    mem_limit: ${ACE4_COLLECTOR_MEM_LIMIT:-512m}
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:13133/status
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 5

  # The core (PLAN.md 2.29): `ace serve`, with the lease API, the JSON API (5.5), the reaper,
  # the QA recorder and, when ACE4_SIGNATURES names a signatures checkout on the host, the
  # ruleset builder. The JSON API, for people and their scripts, is on the stack's one fixed host
  # port, ACE4_PORT_HTTPS, over plain HTTP for now. The lease API, for the pools, stays on the
  # stack's network on 8080, so its tokens' dev defaults aren't reachable from the host. A script
  # submits with an API key: `docker compose exec ace ace user create-key NAME --grant alert:create`
  # prints one; there's no default key. It reads the site overlay from ACE4_SITE's overlay.yaml.
  ace:
    build:
      context: .
      dockerfile: docker/ace4/Dockerfile
      target: ace
    image: ace4-ace:latest
    depends_on:
      stack-guard:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      bucket:
        condition: service_healthy
    environment:
      ACE4_DATABASE_URL: postgres://${ACE4_POSTGRES_USER:-ace4}:${ACE4_POSTGRES_PASSWORD:-ace4-dev-password}@postgres:5432/${ACE4_POSTGRES_DB:-ace4}
      ACE4_BUCKET_ENDPOINT: http://bucket:8333
      ACE4_BUCKET_NAME: ${ACE4_BUCKET_NAME:-ace4}
      ACE4_BUCKET_ACCESS_KEY: ${ACE4_BUCKET_ACCESS_KEY:-ace4-dev}
      ACE4_BUCKET_SECRET_KEY: ${ACE4_BUCKET_SECRET_KEY:-ace4-dev-secret}
      ACE4_API_LISTEN: 0.0.0.0:8080
      ACE4_WEB_LISTEN: 0.0.0.0:8000
      ACE4_OVERLAY: /etc/ace4/overlay.yaml
      # set only when ACE4_SIGNATURES names a checkout; without one nothing builds rulesets
      ACE4_SIGNATURES_REPO: ${ACE4_SIGNATURES:+/signatures}
      ACE4_RULESET_POLL_SECONDS: ${ACE4_RULESET_POLL_SECONDS:-60}
      ACE4_LEASE_SECONDS: ${ACE4_LEASE_SECONDS:-60}
      ACE4_POOL_TOKEN_PARSERS: ${ACE4_POOL_TOKEN_PARSERS:-ace4-dev-parsers-token}
      ACE4_POOL_TOKEN_LOOKUPS: ${ACE4_POOL_TOKEN_LOOKUPS:-ace4-dev-lookups-token}
      ACE4_POOL_TOKEN_SANDBOX: ${ACE4_POOL_TOKEN_SANDBOX:-ace4-dev-sandbox-token}
      ACE4_POOL_TOKEN_SCANNERS: ${ACE4_POOL_TOKEN_SCANNERS:-ace4-dev-scanners-token}
      ACE4_ADMIN_TOKEN: ${ACE4_ADMIN_TOKEN:-ace4-dev-admin-token}
      # the email archive's key (64 hex digits), which only this service holds; with none, nothing is
      # archived or opened
      ACE4_ENCRYPTION_KEY: ${ACE4_ENCRYPTION_KEY:-}
      ACE4_LOG: ${ACE4_LOG:-info}
      NO_PROXY: localhost,127.0.0.1,postgres,bucket,collector
      no_proxy: localhost,127.0.0.1,postgres,bucket,collector
    volumes:
      - ${ACE4_SITE:-./docker/site}:/etc/ace4:ro
      # read-only; the builder reads the checkout's git objects and changes nothing
      - ${ACE4_SIGNATURES:-./docker/site}:/signatures:ro
    ports:
      - "${ACE4_BIND_ADDRESS:-127.0.0.1}:${ACE4_PORT_HTTPS:-7443}:8000"
    mem_limit: ${ACE4_ACE_MEM_LIMIT:-1g}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 5

  # The parser pool: the email, YARA and other file modules, one contained process per task, as
  # the ace4-task user. It leases nothing until the core's first YARA ruleset has loaded.
  parsers:
    build:
      context: .
      dockerfile: docker/ace4/Dockerfile
      target: parsers
    image: ace4-parsers:latest
    depends_on:
      ace:
        condition: service_healthy
    init: true
    environment:
      ACE4_API_URL: http://ace:8080
      ACE4_POOL_TOKEN: ${ACE4_POOL_TOKEN_PARSERS:-ace4-dev-parsers-token}
      ACE4_OVERLAY: /etc/ace4/overlay.yaml
      ACE4_CONCURRENCY: ${ACE4_PARSERS_CONCURRENCY:-4}
      ACE4_RULESET_POLL_SECONDS: ${ACE4_POOL_RULESET_POLL_SECONDS:-30}
      ACE4_LOG: ${ACE4_LOG:-info}
      NO_PROXY: localhost,127.0.0.1,ace,bucket,collector
      no_proxy: localhost,127.0.0.1,ace,bucket,collector
    volumes:
      - ${ACE4_SITE:-./docker/site}:/etc/ace4:ro
    mem_limit: ${ACE4_PARSERS_MEM_LIMIT:-4g}
    restart: unless-stopped
    healthcheck:
      # the pool writes this file every 5 seconds while its runtime runs
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/ace4-health -newermt '-20 seconds')\""]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 3

  # The sandbox pool (PLAN.md 7.3): the parser pool of the modules that run tools, such as
  # Ghostscript, tesseract and ExifTool, whose image carries them. Its supervisor runs each tool a
  # task asks for as a contained process of its own, as ace4-task.
  sandbox:
    build:
      context: .
      dockerfile: docker/ace4/Dockerfile
      target: sandbox
    image: ace4-sandbox:latest
    depends_on:
      ace:
        condition: service_healthy
    init: true
    environment:
      ACE4_API_URL: http://ace:8080
      ACE4_POOL_TOKEN: ${ACE4_POOL_TOKEN_SANDBOX:-ace4-dev-sandbox-token}
      ACE4_OVERLAY: /etc/ace4/overlay.yaml
      ACE4_CONCURRENCY: ${ACE4_SANDBOX_CONCURRENCY:-4}
      ACE4_LOG: ${ACE4_LOG:-info}
      NO_PROXY: localhost,127.0.0.1,ace,bucket,collector
      no_proxy: localhost,127.0.0.1,ace,bucket,collector
    volumes:
      - ${ACE4_SITE:-./docker/site}:/etc/ace4:ro
    mem_limit: ${ACE4_SANDBOX_MEM_LIMIT:-4g}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/ace4-health -newermt '-20 seconds')\""]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 3

  # The network pool: the RDAP, DNS and Splunk modules as async tasks in one contained process. A
  # secret its modules declare comes from where the overlay's secrets: section says, such as
  # ACE4_SPLUNK_PASSWORD.
  lookups:
    build:
      context: .
      dockerfile: docker/ace4/Dockerfile
      target: lookups
    image: ace4-lookups:latest
    depends_on:
      ace:
        condition: service_healthy
    init: true
    environment:
      ACE4_API_URL: http://ace:8080
      ACE4_POOL_TOKEN: ${ACE4_POOL_TOKEN_LOOKUPS:-ace4-dev-lookups-token}
      ACE4_OVERLAY: /etc/ace4/overlay.yaml
      ACE4_CONCURRENCY: ${ACE4_LOOKUPS_CONCURRENCY:-16}
      ACE4_SPLUNK_PASSWORD: ${ACE4_SPLUNK_PASSWORD:-}
      ACE4_LOG: ${ACE4_LOG:-info}
      NO_PROXY: localhost,127.0.0.1,ace,collector,responder
      no_proxy: localhost,127.0.0.1,ace,collector,responder
    volumes:
      - ${ACE4_SITE:-./docker/site}:/etc/ace4:ro
    mem_limit: ${ACE4_LOOKUPS_MEM_LIMIT:-1g}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/ace4-health -newermt '-20 seconds')\""]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 3

  # The scanner pool (PLAN.md 7.7): it runs ace3's phishkit and js-deobfuscator scanner images, which
  # docker/scanners/build builds as ace4-phishkit and ace4-js-deobfuscator, for the scans the parser
  # pool's javascript_deobfuscation and phishkit_analyzer modules ask for. It holds the Docker socket,
  # which is root on the host, so it parses nothing a scanner writes: it copies inputs in and the output
  # directory and logs out, as bytes, and the module's next run reads them, contained. Each scanner's
  # container is a sibling on the host's daemon, labelled ace4.scanner.stack=$ACE4_STACK, named
  # <stack>-scan-<id>-<n>, and removed at its end; ace3's reapers select phishkit.* labels and never
  # see them. js-deobfuscator's has no network; phishkit's is on Docker's default bridge, or the
  # network ACE4_PHISHKIT_NETWORK names, and reaches what that network reaches, the internet included.
  scanners:
    build:
      context: .
      dockerfile: docker/ace4/Dockerfile
      target: scanners
    image: ace4-scanners:latest
    depends_on:
      ace:
        condition: service_healthy
    init: true
    environment:
      ACE4_API_URL: http://ace:8080
      ACE4_POOL_TOKEN: ${ACE4_POOL_TOKEN_SCANNERS:-ace4-dev-scanners-token}
      ACE4_STACK: ${ACE4_STACK:-ace4}
      ACE4_CONCURRENCY: ${ACE4_SCANNERS_CONCURRENCY:-4}
      ACE4_PHISHKIT_IMAGE: ${ACE4_PHISHKIT_IMAGE:-ace4-phishkit:latest}
      ACE4_JS_DEOBFUSCATOR_IMAGE: ${ACE4_JS_DEOBFUSCATOR_IMAGE:-ace4-js-deobfuscator:latest}
      ACE4_PHISHKIT_NETWORK: ${ACE4_PHISHKIT_NETWORK:-}
      ACE4_LOG: ${ACE4_LOG:-info}
      NO_PROXY: localhost,127.0.0.1,ace,bucket,collector
      no_proxy: localhost,127.0.0.1,ace,bucket,collector
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: ${ACE4_SCANNERS_MEM_LIMIT:-2g}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/ace4-health -newermt '-20 seconds')\""]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 3

  # The end-to-end test's recorded RDAP and Splunk APIs (PLAN.md 2.30), behind the e2e
  # profile, so the stack's lookups never reach the internet in the test. Plain HTTP on 443,
  # a port both modules' manifests allow, and DNS on 53 from what ace3's trees were answered;
  # tests/e2e/site/overlay.yaml points them here.
  responder:
    build:
      context: .
      dockerfile: docker/ace4/Dockerfile
      target: responder
    image: ace4-responder:latest
    profiles: [e2e]
    depends_on:
      stack-guard:
        condition: service_completed_successfully
    command:
      - replay-server
      - --listen
      - 0.0.0.0:443
      - --public
      - http://responder:443
      - --recording
      - /recordings/rdap_analyzer/fqdn_example.com.http=https://data.iana.org/
      - --recording
      - /recordings/proxy_domain_lookup/fqdn_www.example.com.http
      - --dns-listen
      - 0.0.0.0:53
      - --dns-recording
      - /recordings/trees.dns.json
    # and on the scanned network, the only one the end-to-end test's phishkit scanners are on
    networks:
      - default
      - scanned
    mem_limit: ${ACE4_RESPONDER_MEM_LIMIT:-128m}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/443"]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 3

  # The end-to-end test's headless browser (PLAN.md 5.8): Chromium's headless shell, pinned by digest,
  # behind the e2e profile. tests/e2e/run drives it over the DevTools protocol on 9222, which publishes
  # on an ephemeral host port bound to ACE4_BIND_ADDRESS, and it opens the GUI at http://ace:8000 on the
  # stack's network. It holds no data and reaches nothing outside the stack.
  browser:
    image: chromedp/headless-shell:156.0.8078.36@sha256:53cc0f33c0598ff244f6e45458f6dfaf0ae4206d388ae7364903afd1d9d14f0a
    profiles: [e2e]
    depends_on:
      stack-guard:
        condition: service_completed_successfully
    ports:
      - "${ACE4_BIND_ADDRESS:-127.0.0.1}::9222"
    mem_limit: ${ACE4_BROWSER_MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9222"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  # The end-to-end test's network for phishkit's scanner containers (PLAN.md 7.7, tests/e2e/run sets
  # ACE4_PHISHKIT_NETWORK to it): internal, so it reaches the responder and nothing outside the stack.
  # Compose makes it only when the e2e profile's responder starts.
  scanned:
    internal: true

volumes:
  postgres-data:
  bucket-data:
  target:
  cargo-registry:
  cargo-git:
  sccache:
