[package]
name = "ace-app"
version = "0.1.0"
description = "Builds the ace binary and each pool binary from a list of crates, here and in site repositories"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The SVS build: `ace yara replay` also reports the slowest rules. Off by default, because
# yara-x's rule profiling slows every scan. `cargo tree -e features -i yara-x -p ace` shows
# whether a build has it; the tree without -i doesn't list features a root feature turns on.
svs = ["ace-yara/rules-profiling"]

[dependencies]
ace-api = { path = "../ace-api" }
ace-core = { path = "../ace-core" }
ace-gui = { path = "../ace-gui" }
ace-hunt = { path = "../ace-hunt" }
# The hunter (PLAN.md 6.4): the Splunk client it searches with, and the email module's port of
# Python's parseaddr, which ace3's email_address observables normalize with.
ace-mod-dns = { path = "../ace-mod-dns" }
ace-mod-email = { path = "../ace-mod-email" }
ace-mod-splunk = { path = "../ace-mod-splunk" }
ace-pool = { path = "../ace-pool" }
ace-results = { path = "../ace-results" }
ace-sdk = { path = "../ace-sdk" }
# The search index and its embedding model, which `ace serve` gives the service (PLAN.md 7.11).
ace-search = { path = "../ace-search" }
ace-service = { path = "../ace-service" }
ace-store = { path = "../ace-store" }
ace-x509 = { path = "../ace-x509" }
ace-yara = { path = "../ace-yara" }
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
# The scheduler's cron schedules (PLAN.md 6.7), as ace-hunt parses a hunt's.
croner = { version = "=4.0.2", default-features = false, features = ["chrono"] }
# The hunt script command types' network (PLAN.md decision 16): their DNS records, and a TLS
# handshake that verifies a server's chain to the platform's roots but not its name.
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
# `ace compare` posts each sample to the JSON API's submit endpoint. ace-sdk picks reqwest's features.
reqwest = { version = "0.13.5", default-features = false }
# The NRD refresh's tests serve over TLS; the script types' certificate probe connects with it.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26.6"
tokio-util = "0.7.20"
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["serde", "v4"] }

[dev-dependencies]
# The hunter's test records its runs in a test database (PLAN.md 6.5).
ace-core = { path = "../ace-core", features = ["testing"] }
# The open-source parser pool's modules, for the unit test of the YARA module's ruleset directory.
ace-mod-yara = { path = "../ace-mod-yara" }
# The hunter's test replays ace3's exchanges with the fake Splunk.
ace-testkit = { path = "../ace-testkit" }
# The NRD refresh's tests serve its feeds over TLS with a certificate made for the test (PLAN.md 7.4).
rcgen = "0.14.10"
# The pools' tests declare parsers of their own, whose types need a schema.
schemars = "1.2.3"
# The test of an analysis limit naming a module the binary hasn't declares a lookup on the example's types.
ace-sdk = { path = "../ace-sdk", features = ["example-modules"] }
# The scheduler's tests (PLAN.md 6.7) set up and read rows directly.
sqlx = { version = "0.9.0", default-features = false, features = ["chrono", "json", "postgres", "runtime-tokio", "uuid"] }

[lints]
workspace = true
