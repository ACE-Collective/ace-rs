rule:
  uuid: 00000000-0000-0000-0000-00000000b101
  name: fixture known source
  type: splunk
  enabled: true
  description: a correlated hunt whose query source and Splunk instance the overlay defines
  alert_type: hunter - splunk - fixture
  frequency: "00:05:00"
  time_range: "00:05:00"
  full_coverage: false
  use_index_time: true
  query: index=main | head 1
  correlate:
    logic:
      - transform:
          type: event
          method: property
          property_name: context
          property_type: list
          command:
            type: query
            source: splunk
            query: "search index=ctx host={{ _event.host }}"
