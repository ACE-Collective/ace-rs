[package]
name = "ace-core"
version = "0.1.0"
description = "The core: the database schema, the task queue, eligibility, the lease API and submissions"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test databases: a template migrated once and a copy per test. For this crate's tests and the
# tests of crates that use the core.
testing = []

[dependencies]
ace-results = { path = "../ace-results" }
ace-sdk = { path = "../ace-sdk" }
ace-store = { path = "../ace-store" }
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# Queries are checked against the migrated schema at build time, from the offline data in the
# workspace's .sqlx/ when no database is set (PLAN.md 2.2).
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "macros", "migrate", "sqlx-toml", "uuid", "chrono", "json"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
ace-core = { path = ".", features = ["testing"] }
# The ported modules' manifests, for eligibility's tests; 2.9's check runs 1.28's delayed
# module through the queue against its recorded Splunk API.
ace-mod-archive = { path = "../ace-mod-archive" }
ace-mod-email = { path = "../ace-mod-email" }
ace-mod-rdap = { path = "../ace-mod-rdap" }
ace-mod-splunk = { path = "../ace-mod-splunk" }
ace-mod-yara = { path = "../ace-mod-yara" }
ace-testkit = { path = "../ace-testkit" }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util", "macros", "process", "rt-multi-thread"] }

[lints]
workspace = true
