[package]
name = "ace-core"
version = "0.1.0"
description = "The core: the database schema, the task queue, eligibility, the lease API and submissions"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test databases: a template migrated once and a copy per test. For this crate's tests and the
# tests of crates that use the core.
testing = ["dep:sha2"]

[dependencies]
sha2 = { version = "0.11.1", optional = true }
# Queries are checked against the migrated schema at build time, from the offline data in the
# workspace's .sqlx/ when no database is set (PLAN.md 2.2).
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "macros", "migrate", "sqlx-toml"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
ace-core = { path = ".", features = ["testing"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
