[package]
name = "ace-core"
version = "0.1.0"
description = "The core: the database schema, the task queue, eligibility, the lease API and what a submission writes"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# the tests are one program, tests/main.rs
autotests = false

[features]
# Test databases: a template migrated once and a copy per test. For this crate's tests and the
# tests of crates that use the core.
testing = []

[dependencies]
# Python's str() of a details value, which the observable modifier's details_match tests (hooks).
ace-pycompat = { path = "../ace-pycompat" }
# SVS reads Atomic Red Team's files with its bounded PyYAML loader, and hunts with its loader (PLAN.md 7.10).
ace-hunt = { path = "../ace-hunt" }
ace-results = { path = "../ace-results" }
ace-sdk = { path = "../ace-sdk" }
ace-store = { path = "../ace-store" }
ace-yara = { path = "../ace-yara" }
# The email archive's AES-256-GCM, as ace3's `saq.crypto` (email_archive.rs).
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# The largest gap between a cron hunt's firings, for a run's observation window (PLAN.md 7.10 batch 4).
croner = { version = "=4.0.2", default-features = false, features = ["chrono"] }
# The archive gzips an email before it encrypts it, as ace3's does.
flate2 = "1.1.10"
getrandom = "0.4.3"
# SVS validation kills a git command's process group at its timeout, and locks its mirror (PLAN.md 7.10).
libc = "0.2.191"
hex = "0.4.3"
# The lease API's spans join their callers' traces (PLAN.md 2.22).
opentelemetry = "0.33.1"
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
# The snort rules' sid and rev, for the snort-signature read (reads.rs).
regex = "1.13.1"
# the observable modifier's patterns, which are Python `re`'s: look-around and backreferences, with a
# backtracking bound (hooks/rules.rs)
fancy-regex = "0.19.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# Queries are checked against the migrated schema at build time, from the offline data in the
# workspace's .sqlx/ when no database is set (PLAN.md 2.2).
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "macros", "migrate", "sqlx-toml", "uuid", "chrono", "json"] }
thiserror = "2.0.21"
# SVS validation's working directory (PLAN.md 7.10).
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.34.0", default-features = false }
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
ace-core = { path = ".", features = ["testing"] }
# The ported modules' manifests, for eligibility's tests; 2.9's check runs 1.28's delayed
# module through the queue against its recorded Splunk API.
ace-mod-archive = { path = "../ace-mod-archive" }
# the email logger, which requires a directive and runs last (PLAN.md 7.4)
ace-mod-brocess = { path = "../ace-mod-brocess" }
ace-mod-email = { path = "../ace-mod-email" }
ace-mod-rdap = { path = "../ace-mod-rdap" }
ace-mod-splunk = { path = "../ace-mod-splunk" }
ace-mod-yara = { path = "../ace-mod-yara" }
ace-testkit = { path = "../ace-testkit" }
# The health endpoint's test asks over HTTP.
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
schemars = "1.2.3"
# The metrics event's test reads the log records a pass's end emits (tests/completion.rs).
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util", "macros", "process", "rt-multi-thread"] }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
