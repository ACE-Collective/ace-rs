[package]
name = "ace-gui"
version = "0.1.0"
description = "The GUI: server-rendered HTML over the service layer, with Datastar"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Its tests are tests/gui.rs, so the crate adds one test binary (PLAN.md 2.33). The doctests are the
# templates' compile-fail check (`templates`' docs).
[lib]
test = false

[dependencies]
ace-service = { path = "../ace-service" }
# Templates compile into the binary, are checked against their structs, and escape HTML by default.
askama = "0.16.1"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
# The alert view's event stream is an unfolded stream.
futures-util = { version = "0.3.34", default-features = false }
# The CSP nonce.
getrandom = "0.4.3"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_urlencoded = "0.7.1"
# An asset's URL carries a hash of its bytes.
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1.44"
uuid = "1.29.0"

[dev-dependencies]
ace-core = { path = "../ace-core", features = ["testing"] }
ace-results = { path = "../ace-results" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
serde_json = "1.0.154"
uuid = "1.29.0"
reqwest = { version = "0.13.5", default-features = false, features = ["form"] }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[lints]
workspace = true
