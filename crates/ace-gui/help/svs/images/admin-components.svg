<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" font-family="Inter, Arial, sans-serif" font-size="14" fill="#212529">
  <title>The parts of ACE that SVS runs on, and how data moves between them</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="630" fill="#ffffff"/>

  <!-- outside ACE -->
  <g>
    <rect x="20" y="20" width="200" height="64" rx="6" fill="#f1f3f5" stroke="#868e96"/>
    <text x="120" y="45" text-anchor="middle" font-weight="600">Git servers</text>
    <text x="120" y="66" text-anchor="middle" font-size="12" fill="#495057">ART catalog, YARA rules</text>

    <rect x="250" y="20" width="200" height="64" rx="6" fill="#f1f3f5" stroke="#868e96"/>
    <text x="350" y="45" text-anchor="middle" font-weight="600">Launcher (outside ACE)</text>
    <text x="350" y="66" text-anchor="middle" font-size="12" fill="#495057">API key: svs:run_register</text>

    <rect x="470" y="20" width="200" height="64" rx="6" fill="#f1f3f5" stroke="#868e96"/>
    <text x="570" y="45" text-anchor="middle" font-weight="600">Rule repository CI</text>
    <text x="570" y="66" text-anchor="middle" font-size="12" fill="#495057">API key: svs:validate</text>

    <rect x="740" y="20" width="200" height="64" rx="6" fill="#f1f3f5" stroke="#868e96"/>
    <text x="840" y="45" text-anchor="middle" font-weight="600">Test hosts' telemetry</text>
    <text x="840" y="66" text-anchor="middle" font-size="12" fill="#495057">ace hunter and other submitters</text>
  </g>

  <!-- the ACE frame -->
  <rect x="10" y="110" width="940" height="505" rx="8" fill="none" stroke="#adb5bd" stroke-dasharray="6 4"/>
  <text x="24" y="134" font-size="12" font-weight="600" fill="#495057">ACE</text>

  <!-- row A -->
  <rect x="30" y="150" width="200" height="90" rx="6" fill="#eef6ef" stroke="#6a9f72"/>
  <text x="130" y="174" text-anchor="middle" font-weight="600">SVS's git mirrors</text>
  <text x="130" y="195" text-anchor="middle" font-size="12" fill="#495057">bare clones ace serve keeps</text>
  <text x="130" y="212" text-anchor="middle" font-size="12" fill="#495057">of each listed repository</text>

  <rect x="250" y="150" width="340" height="90" rx="6" fill="#e9f1fb" stroke="#5b8bc9"/>
  <text x="420" y="174" text-anchor="middle" font-weight="600">ace serve: the JSON API and the GUI</text>
  <text x="420" y="195" text-anchor="middle" font-size="12" fill="#495057">/api/svs/v1/: runs, test hosts, validations,</text>
  <text x="420" y="212" text-anchor="middle" font-size="12" fill="#495057">coverage, samples; the SVS area and the</text>
  <text x="420" y="229" text-anchor="middle" font-size="12" fill="#495057">Signatures hub, drawn by the server</text>

  <rect x="620" y="150" width="310" height="90" rx="6" fill="#f3eefa" stroke="#8a72b5"/>
  <text x="775" y="174" text-anchor="middle" font-weight="600">ace serve: the end of an analysis pass</text>
  <text x="775" y="195" text-anchor="middle" font-size="12" fill="#495057">svs_alert_tagger hook: attributions, tags,</text>
  <text x="775" y="212" text-anchor="middle" font-size="12" fill="#495057">mismatch detections</text>
  <text x="775" y="229" text-anchor="middle" font-size="12" fill="#495057">svs_marker alert router: the svs queue</text>

  <!-- row B -->
  <rect x="30" y="285" width="300" height="135" rx="6" fill="#fdf5e6" stroke="#c9a04f"/>
  <text x="180" y="309" text-anchor="middle" font-weight="600">ace serve: scheduler and workers</text>
  <text x="180" y="330" text-anchor="middle" font-size="12" fill="#495057">svs_run_timers: every minute</text>
  <text x="180" y="348" text-anchor="middle" font-size="12" fill="#495057">svs_catalog_refresh: every 5 minutes</text>
  <text x="180" y="366" text-anchor="middle" font-size="12" fill="#495057">svs_coverage_refresh: every 2 minutes</text>
  <text x="180" y="384" text-anchor="middle" font-size="12" fill="#495057">daily: coverage snapshot, validations prune</text>
  <text x="180" y="402" text-anchor="middle" font-size="12" fill="#495057">YARA validation workers</text>

  <rect x="370" y="295" width="210" height="100" rx="6" fill="#f1f3f5" stroke="#868e96"/>
  <text x="475" y="319" text-anchor="middle" font-weight="600">Postgres</text>
  <text x="475" y="340" text-anchor="middle" font-size="12" fill="#495057">schema svs: runs, attributions,</text>
  <text x="475" y="357" text-anchor="middle" font-size="12" fill="#495057">coverage, validations; the claims</text>
  <text x="475" y="374" text-anchor="middle" font-size="12" fill="#495057">and leases replicas share</text>

  <rect x="620" y="285" width="310" height="115" rx="6" fill="#f3eefa" stroke="#8a72b5"/>
  <text x="775" y="309" text-anchor="middle" font-weight="600">Pools</text>
  <text x="775" y="330" text-anchor="middle" font-size="12" fill="#495057">parsers: YARA scans with the ruleset,</text>
  <text x="775" y="347" text-anchor="middle" font-size="12" fill="#495057">which holds the SVS_Marker rule</text>
  <text x="775" y="364" text-anchor="middle" font-size="12" fill="#495057">lookups: svs_yara_sample_capture</text>
  <text x="775" y="381" text-anchor="middle" font-size="12" fill="#495057">on a dispositioned alert's files</text>

  <!-- row C -->
  <rect x="30" y="470" width="300" height="90" rx="6" fill="#fdf5e6" stroke="#c9a04f"/>
  <text x="180" y="494" text-anchor="middle" font-weight="600">Contained scan</text>
  <text x="180" y="515" text-anchor="middle" font-size="12" fill="#495057">ace yara replay --contained</text>
  <text x="180" y="532" text-anchor="middle" font-size="12" fill="#495057">compiles and scans both commits</text>
  <text x="180" y="549" text-anchor="middle" font-size="12" fill="#495057">no network, in svs.yara.work_dir</text>

  <rect x="370" y="470" width="560" height="90" rx="6" fill="#e9f1fb" stroke="#5b8bc9"/>
  <text x="650" y="494" text-anchor="middle" font-weight="600">The bucket (S3-compatible object store)</text>
  <text x="650" y="515" text-anchor="middle" font-size="12" fill="#495057">pool svs_samples: the bytes of captured YARA samples</text>
  <text x="650" y="532" text-anchor="middle" font-size="12" fill="#495057">alert files and QA-mode matches in their own pools</text>
  <text x="650" y="549" text-anchor="middle" font-size="12" fill="#495057">one bucket, shared by every replica and pool</text>

  <!-- flows -->
  <g fill="none" stroke="#495057" stroke-width="1.5">
    <line x1="120" y1="84" x2="120" y2="148" marker-end="url(#arrow)"/>
    <line x1="350" y1="84" x2="350" y2="148" marker-end="url(#arrow)"/>
    <line x1="560" y1="84" x2="530" y2="148" marker-end="url(#arrow)"/>
    <line x1="840" y1="84" x2="820" y2="148" marker-end="url(#arrow)"/>
    <line x1="120" y1="240" x2="120" y2="283" marker-end="url(#arrow)"/>
    <line x1="440" y1="242" x2="440" y2="293" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <polyline points="680,242 680,266 540,266 540,293" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="332" y1="345" x2="368" y2="345" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="800" y1="242" x2="800" y2="283" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="120" y1="420" x2="120" y2="468" marker-end="url(#arrow)"/>
    <line x1="800" y1="400" x2="800" y2="468" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <polyline points="500,560 500,590 180,590 180,562" marker-end="url(#arrow)"/>
  </g>

  <!-- flow labels -->
  <g font-size="11" fill="#495057">
    <text x="128" y="104">fetch</text>
    <text x="848" y="122">alerts</text>
    <text x="128" y="266">atomics, both commits' rules</text>
    <text x="548" y="260">attributions, queue</text>
    <text x="808" y="266">lease API: tasks, results</text>
    <text x="128" y="448">validations</text>
    <text x="808" y="438">files, sample captures</text>
    <text x="200" y="584">plaintext copies of the samples</text>
  </g>
</svg>
