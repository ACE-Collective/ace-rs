{#- An action's tries, newest first (src/remediation.rs). -#}
  <h2>History</h2>
  <div class="table-wrap"><table class="keys">
    <thead><tr><th>When (UTC)</th><th>Status</th><th>Result</th><th>Message</th></tr></thead>
    <tbody>
      {%- for a in view.attempts %}
      <tr><td class="nowrap">{{ a.at }}</td><td>{{ a.status }}</td><td>{{ a.result }}</td><td>{{ a.message }}</td></tr>
      {%- else %}
      <tr><td colspan="4" class="muted">No tries yet.</td></tr>
      {%- endfor %}
    </tbody>
  </table></div>
