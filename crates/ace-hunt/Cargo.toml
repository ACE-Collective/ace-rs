[package]
name = "ace-hunt"
version = "0.1.0"
description = "Hunts: the model, loading them from a signatures checkout and rendering their templates as ace3's hunter does"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ace-pycompat = { path = "../ace-pycompat" }
# ace3's observable classes' rules, which the core applies too
ace-results = { path = "../ace-results" }
ace-sdk = { path = "../ace-sdk" }
# Query hunts' windows and the Splunk times they search, in an instance's timezone (6.4).
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
chrono-tz = "0.10.4"
# A cron frequency is checked as ace3 checks it with croniter, and its next time found (6.4).
croner = { version = "=4.0.2", default-features = false, features = ["chrono"] }
# Hunt templates (6.3). The machinery gives the parser and code generator, so ace-hunt rewrites a
# template's operators and literals into Python's before compiling it; builtins is for `namespace`,
# whose object `{% set ns.x %}` needs; fuel bounds a render, and doesn't build without
# multi_template. No loop_controls: ace3's Jinja has no break or continue.
minijinja = { version = "=3.0.5", default-features = false, features = ["builtins", "macros", "multi_template", "adjacent_loop_items", "fuel", "preserve_order", "unstable_machinery"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# A correlation command's cache key, ace3's sha256 of its arguments (6.6).
sha2 = "0.11.1"
thiserror = "2.0.21"
# The YAML parser, for its events: ace-hunt builds the values itself, as PyYAML's SafeLoader
# resolves them (YAML 1.1), with bounds on size, depth and aliases.
yaml-rust2 = { version = "0.13.0", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
