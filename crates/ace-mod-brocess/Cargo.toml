[package]
name = "ace-mod-brocess"
version = "0.1.0"
description = "The modules that read and write brocess, what ACE's email modules have seen before, through the core's reads and writes, and the two that read the frequency module's tags"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# ace3's header helpers, as the email module reads them.
ace-mod-email = { path = "../ace-mod-email" }
# Python's address parsing.
ace-pycompat = { path = "../ace-pycompat" }
# Python's `re` patterns, which the link module's settings are.
ace-mod-urls = { path = "../ace-mod-urls" }
ace-results = { path = "../ace-results" }
ace-sdk = { path = "../ace-sdk" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
# A domain's punycode form, for the look-alike checks.
idna = "1.1.0"
# fluent-bit's forward protocol is MessagePack.
rmp-serde = "1.3.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "net", "time"] }
tracing = "0.1.44"
# jellyfish's distances count grapheme clusters.
unicode-segmentation = "1.13.3"

[dev-dependencies]
ace-testkit = { path = "../ace-testkit" }
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
