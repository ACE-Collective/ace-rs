[package]
name = "ace-mod-brocess"
version = "0.1.0"
description = "The modules that read brocess, what ACE's email modules have seen before, through the core's reads"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ace-results = { path = "../ace-results" }
ace-sdk = { path = "../ace-sdk" }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
ace-testkit = { path = "../ace-testkit" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt"] }

[lints]
workspace = true
