[package]
name = "ace-mod-dns"
version = "0.1.0"
description = "The DNS module: what a domain name resolves to, and whether it resolves at all"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ace-results = { path = "../ace-results" }
ace-sdk = { path = "../ace-sdk" }
# hickory-dns's protocol library, for DNS messages. The module sends them itself, as dnspython's
# stub resolver does, so the answer is the one the resolver gave, CNAME chain and all.
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "net", "time"] }
tracing = "0.1.44"

[dev-dependencies]
ace-testkit = { path = "../ace-testkit" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt"] }

[lints]
workspace = true
