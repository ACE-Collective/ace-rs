[package]
name = "ace-mod-email"
version = "0.1.0"
description = "The email module: an RFC 822 message's headers, addresses, body parts and attachments"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# the tests are one program, tests/main.rs
autotests = false

[dependencies]
ace-results = { path = "../ace-results" }
ace-sdk = { path = "../ace-sdk" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
# Python's codecs for the charsets ace3 decodes headers and bodies with.
encoding_rs = "0.8.35"
mail-parser = "1.0.1"
regex = "1.13.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
# sha1 for ace3's shortened file names, sha256 for the log entry's attachment hashes
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
ace-testkit = { path = "../ace-testkit" }
serde_json = "1.0.154"

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
