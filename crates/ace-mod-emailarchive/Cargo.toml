[package]
name = "ace-mod-emailarchive"
version = "0.1.0"
description = "The modules of PLAN.md 7.5 batch 9 on ACE's email archive: email_archiver and message_id_analyzer_v2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Python's address parsing, as ace3's archive normalizes a recipient.
ace-mod-email = { path = "../ace-mod-email" }
ace-results = { path = "../ace-results" }
ace-sdk = { path = "../ace-sdk" }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
tracing = "0.1.44"

[dev-dependencies]
ace-testkit = { path = "../ace-testkit" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
