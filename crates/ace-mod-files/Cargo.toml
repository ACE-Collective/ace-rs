[package]
name = "ace-mod-files"
version = "0.1.0"
description = "The file identity modules of PLAN.md 7.5 batch 2, file_type, file_hash_analyzer, binary_file_analyzer, x509_analyzer, lnk_parser and dhash, and batch 10's ssdeep"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ace-dhash = { path = "../ace-dhash" }
ace-lnkparse = { path = "../ace-lnkparse" }
ace-mod-oletools = { path = "../ace-mod-oletools" }
ace-pycompat = { path = "../ace-pycompat" }
ace-results = { path = "../ace-results" }
ace-x509 = { path = "../ace-x509" }
ace-sdk = { path = "../ace-sdk" }
# ssdeep's hashes (PLAN.md 7.3); the comparison is ssdeep 2.14.1's, in src/ssdeep.rs.
fuzzyhash = "0.2.2"
magic-sys = "0.4.3"
md5 = { package = "md-5", version = "0.11.0" }
oxc_allocator = "0.157.0"
oxc_ast = "0.157.0"
oxc_ast_visit = "0.157.0"
oxc_parser = "0.157.0"
oxc_semantic = "0.157.0"
oxc_span = "0.157.0"
regex = "1.13.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
stacker = "0.1.21"
tracing = "0.1.44"

[dev-dependencies]
base64 = "0.22.1"
ace-testkit = { path = "../ace-testkit" }
tempfile = "3.27.0"

[lints]
workspace = true
