[package]
name = "ace-mod-html"
version = "0.1.0"
description = "The HTML modules of PLAN.md 7.5 batch 4: html_data_url_extraction, har_extraction, html_js_extraction and mhtml"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ace-lxml = { path = "../ace-lxml" }
ace-mod-oletools = { path = "../ace-mod-oletools" }
ace-pycompat = { path = "../ace-pycompat" }
ace-results = { path = "../ace-results" }
ace-sdk = { path = "../ace-sdk" }
ace-urlfinder = { path = "../ace-urlfinder" }
memchr = "2.8.3"
regex = "1.13.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tracing = "0.1.44"

[dev-dependencies]
# the type step, so the declarations on a file's type are checked as the pool checks them
ace-mod-files = { path = "../ace-mod-files" }
ace-testkit = { path = "../ace-testkit" }

[lints]
workspace = true
