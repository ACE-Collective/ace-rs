[package]
name = "ace-mod-msoffice"
version = "0.1.0"
description = "The msoffice_encryption_analyzer module: ports of msoffcrypto-tool and html2text"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "msoffcrypto"
path = "src/bin/msoffcrypto.rs"

[[bin]]
name = "html2text"
path = "src/bin/html2text.rs"

[dependencies]
ace-mod-oletools = { path = "../ace-mod-oletools" }
ace-results = { path = "../ace-results" }
ace-sdk = { path = "../ace-sdk" }
aes = "0.9.4"
cbc = "0.2.1"
cipher = "0.5.2"
digest = "0.11.3"
md-5 = "0.11.0"
rc4 = "0.2.0"
regex = "1.13.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tracing = "0.1.44"

[dev-dependencies]
ace-testkit = { path = "../ace-testkit" }
tempfile = "3.27.0"

[lints]
workspace = true
