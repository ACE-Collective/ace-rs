[package]
name = "ace-mod-msoffice"
version = "0.1.0"
description = "The msoffice_encryption_analyzer module: ports of msoffcrypto-tool and html2text"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "msoffcrypto"
path = "src/bin/msoffcrypto.rs"

[[bin]]
name = "html2text"
path = "src/bin/html2text.rs"

[dependencies]
ace-mod-oletools = { path = "../ace-mod-oletools" }
ace-pycompat = { path = "../ace-pycompat" }
ace-results = { path = "../ace-results" }
ace-sdk = { path = "../ace-sdk" }
regex = "1.13.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"

[dev-dependencies]
ace-testkit = { path = "../ace-testkit" }
tempfile = "3.27.0"

[lints]
workspace = true
