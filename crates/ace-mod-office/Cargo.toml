[package]
name = "ace-mod-office"
version = "0.1.0"
description = "The Office container modules of PLAN.md 7.5 batch 5: onenote_extraction, officeparser3, office_xml_rel, xml_binary_analyzer, xml_plain_text_analyzer, extracted_ole_analyzer, hidden_mime and active_mime"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ace-lxml = { path = "../ace-lxml" }
ace-mod-email = { path = "../ace-mod-email" }
ace-mod-files = { path = "../ace-mod-files" }
ace-mod-oletools = { path = "../ace-mod-oletools" }
ace-pycompat = { path = "../ace-pycompat" }
ace-results = { path = "../ace-results" }
ace-sdk = { path = "../ace-sdk" }
ace-mod-urls = { path = "../ace-mod-urls" }
flate2 = "1.1.10"
memchr = "2.8.3"
regex = "1.13.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tracing = "0.1.44"

[dev-dependencies]
ace-testkit = { path = "../ace-testkit" }

[lints]
workspace = true
