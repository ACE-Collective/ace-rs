[package]
name = "ace-mod-oletools"
version = "0.1.0"
description = "The olevba and rtfole modules: ports of what they call in oletools, olefile and pcodedmp"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "olevba"
path = "src/bin/olevba.rs"

[[bin]]
name = "rtfobj"
path = "src/bin/rtfobj.rs"

[[bin]]
name = "pcodedmp"
path = "src/bin/pcodedmp.rs"

[[bin]]
name = "xlmdeobfuscator"
path = "src/bin/xlmdeobfuscator.rs"

[dependencies]
ace-results = { path = "../ace-results" }
ace-sdk = { path = "../ace-sdk" }
ace-xlrd = { path = "../ace-xlrd" }
ace-xlsb = { path = "../ace-xlsb" }
aes = "0.9.4"
base64 = "0.22.1"
bzip2 = "0.6.1"
cbc = "0.2.1"
cipher = "0.5.2"
crc32fast = "1.5.4"
digest = "0.11.3"
encoding_rs = "0.8.44"
fancy-regex = "0.19.2"
flate2 = "1.1.10"
indexmap = "2"
md-5 = "0.11.0"
memchr = "2.8.3"
rc4 = "0.2.0"
regex = "1.13.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tracing = "0.1.44"

[dev-dependencies]
ace-testkit = { path = "../ace-testkit" }

[lints]
workspace = true
