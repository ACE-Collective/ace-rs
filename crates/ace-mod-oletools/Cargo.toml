[package]
name = "ace-mod-oletools"
version = "0.1.0"
description = "The olevba and rtfole modules: ports of what they call in oletools, olefile and pcodedmp"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "olevba"
path = "src/bin/olevba.rs"

[[bin]]
name = "rtfobj"
path = "src/bin/rtfobj.rs"

[[bin]]
name = "pcodedmp"
path = "src/bin/pcodedmp.rs"

[dependencies]
ace-results = { path = "../ace-results" }
ace-sdk = { path = "../ace-sdk" }
base64 = "0.22.1"
bzip2 = "0.6.1"
crc32fast = "1.5.4"
encoding_rs = "0.8.44"
flate2 = "1.1.10"
md-5 = "0.11.0"
memchr = "2.8.3"
regex = "1.13.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"

[dev-dependencies]
ace-testkit = { path = "../ace-testkit" }

[lints]
workspace = true
