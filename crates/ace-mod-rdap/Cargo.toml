[package]
name = "ace-mod-rdap"
version = "0.1.0"
description = "The RDAP module: registration data for domains and IP addresses"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ace-pycompat = { path = "../ace-pycompat" }
ace-results = { path = "../ace-results" }
ace-sdk = { path = "../ace-sdk" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
# ICANN's RDAP library: the response model and the bootstrap registries. Its client crate
# brings its own reqwest with native-tls and a vendored OpenSSL, so requests go through
# ace-sdk's HttpClient instead.
icann-rdap-common = "1.0.1"
ipnet = "2.12.2"
# Only for its status codes; ace-sdk picks reqwest's features.
reqwest = { version = "0.13.5", default-features = false }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync"] }
tracing = "0.1.44"

[dev-dependencies]
ace-testkit = { path = "../ace-testkit" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", features = ["macros", "rt"] }

[lints]
workspace = true
