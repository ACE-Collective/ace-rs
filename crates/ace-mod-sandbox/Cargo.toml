[package]
name = "ace-mod-sandbox"
version = "0.1.0"
description = "The modules of PLAN.md 7.5 batches 10 and 11 that run tools in the sandbox runner: ocr, qrcode, exif, pdftotext, java_class_decompiler, upx, autoit, de4dot and ilspy"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# file_type's checks of a file, as ace3's is_file_type.py
ace-mod-files = { path = "../ace-mod-files" }
# Python's json.loads, for exiftool's output as ace3 reads it
ace-pycompat = { path = "../ace-pycompat" }
ace-results = { path = "../ace-results" }
ace-sdk = { path = "../ace-sdk" }
# OpenCV 5.0.0, ace3's, as the dev image and the build stage build it (docker/dev/Dockerfile's
# opencv stage): the ocr module's preprocessing and the qrcode module's fallback decoder. clang-runtime
# loads libclang as bindgen, elsewhere in the workspace, has clang-sys do.
opencv = { version = "0.102.0", default-features = false, features = ["clang-runtime", "imgproc", "imgcodecs", "photo", "objdetect"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# Python's re patterns of ace3's OCR clean-up, which need nothing the regex crate lacks
regex = "1.13.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The en_US Hunspell dictionary's check, which ace3 asks enchant for (MPL-2.0)
spellbook = "0.4.2"
tracing = "0.1.44"

[dev-dependencies]
# pdf_link_text, the PDF crate's module that runs a tool, joins this crate's reference test
ace-mod-pdf = { path = "../ace-mod-pdf" }
ace-testkit = { path = "../ace-testkit" }
tempfile = "3.27.0"
serde_json = "1.0.154"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[lints]
workspace = true
