[package]
name = "ace-mod-svs"
version = "0.1.0"
description = "SVS's sample capture: the files YARA rules matched on alerts graded TP or FP, kept as samples"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ace-results = { path = "../ace-results" }
ace-sdk = { path = "../ace-sdk" }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"

[dev-dependencies]
ace-testkit = { path = "../ace-testkit" }
tokio = { version = "1.54.1", features = ["macros", "rt"] }

[lints]
workspace = true
