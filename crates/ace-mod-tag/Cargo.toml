[package]
name = "ace-mod-tag"
version = "0.1.0"
description = "The tagging and detection modules: observables flagged for detection, the tags analysts map to an observable, and a site's tag rows"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ace-pycompat = { path = "../ace-pycompat" }
ace-results = { path = "../ace-results" }
ace-sdk = { path = "../ace-sdk" }
regex = "1.13.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"

[dev-dependencies]
ace-testkit = { path = "../ace-testkit" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt"] }

[lints]
workspace = true
