[package]
name = "ace-mod-urls"
version = "0.1.0"
description = "The url_extraction and ioc_extraction modules, on ace-urlfinder's port of urlfinderlib"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# the tests are one program, tests/main.rs
autotests = false

[dependencies]
ace-lxml = { path = "../ace-lxml" }
ace-pycompat = { path = "../ace-pycompat" }
ace-results = { path = "../ace-results" }
ace-sdk = { path = "../ace-sdk" }
ace-urlfinder = { path = "../ace-urlfinder" }
fancy-regex = "0.19.2"
regex = "1.13.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"

[dev-dependencies]
ace-mod-files = { path = "../ace-mod-files" }
ace-testkit = { path = "../ace-testkit" }
tempfile = "3.27.0"

[[test]]
name = "integration"
path = "tests/main.rs"

[lints]
workspace = true
