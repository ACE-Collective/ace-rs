[package]
name = "ace-mod-values"
version = "0.1.0"
description = "The modules of PLAN.md 7.5 batch 3, which read an observable's value: command_line_analyzer, file_path_analysis, file_location_analysis, network_identifier, parse_url, idna_analyzer, email_address_fqdn_analyzer and protected_url_analyzer, with protected_url_one_drive on the lookup pool"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ace-mod-urls = { path = "../ace-mod-urls" }
ace-pycompat = { path = "../ace-pycompat" }
ace-results = { path = "../ace-results" }
ace-sdk = { path = "../ace-sdk" }
ace-urlfinder = { path = "../ace-urlfinder" }
reqwest = { version = "0.13.1", default-features = false }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"

[dev-dependencies]
ace-testkit = { path = "../ace-testkit" }
tokio = { version = "1.54.1", features = ["macros", "rt"] }

[lints]
workspace = true
