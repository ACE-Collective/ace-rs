[package]
name = "ace-mod-xlm"
version = "0.1.0"
description = "The xlmdeobfuscator and pcodedmp modules, on ace-mod-oletools' ports of XLMMacroDeobfuscator and pcodedmp"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ace-mod-oletools = { path = "../ace-mod-oletools" }
ace-results = { path = "../ace-results" }
ace-sdk = { path = "../ace-sdk" }
regex = "1.13.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"
yara-x = "1.22.1"

[dev-dependencies]
ace-testkit = { path = "../ace-testkit" }
serde_json = "1.0.154"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

# build.rs compiles the rule file and serializes it with its machine code: the version must be the
# one the crate runs, or the bytes don't load and the rules are compiled again in every task.
[build-dependencies]
yara-x = { version = "=1.22.1", features = ["native-code-serialization"] }

[lints]
workspace = true
