[package]
name = "ace-mod-yara"
version = "0.1.0"
description = "The YARA module: the rules a file matches, through ace-yara's scanner layers"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# the tests are one program, tests/main.rs
autotests = false

[dependencies]
ace-libmagic = { path = "../ace-libmagic" }
ace-results = { path = "../ace-results" }
ace-sdk = { path = "../ace-sdk" }
ace-yara = { path = "../ace-yara" }
regex = "1.13.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"

[dev-dependencies]
ace-testkit = { path = "../ace-testkit" }
tempfile = "3.27.0"

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
