[package]
name = "ace-pool"
version = "0.1.0"
description = "The pool runtime: lease loop, task supervisor and containment"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The test pool binary and its modules, for this crate's tests.
test-pools = ["dep:ace-mod-archive", "dep:ace-mod-brocess", "dep:ace-mod-email", "dep:ace-mod-emailtree", "dep:ace-mod-encrypted", "dep:ace-mod-files", "dep:ace-mod-html", "dep:ace-mod-msoffice", "dep:ace-mod-office", "dep:ace-mod-oletools", "dep:ace-mod-pdf", "dep:ace-mod-scripts", "dep:ace-mod-urls", "dep:ace-mod-values", "dep:ace-mod-xlm", "dep:ace-mod-yara", "dep:schemars"]

[[bin]]
name = "test-pool"
required-features = ["test-pools"]

[dependencies]
ace-mod-archive = { path = "../ace-mod-archive", optional = true }
ace-mod-brocess = { path = "../ace-mod-brocess", optional = true }
ace-mod-email = { path = "../ace-mod-email", optional = true }
ace-mod-emailtree = { path = "../ace-mod-emailtree", optional = true }
ace-mod-encrypted = { path = "../ace-mod-encrypted", optional = true }
ace-mod-files = { path = "../ace-mod-files", optional = true }
ace-mod-html = { path = "../ace-mod-html", optional = true }
ace-mod-office = { path = "../ace-mod-office", optional = true }
ace-mod-msoffice = { path = "../ace-mod-msoffice", optional = true }
ace-mod-oletools = { path = "../ace-mod-oletools", optional = true }
ace-mod-pdf = { path = "../ace-mod-pdf", optional = true }
ace-mod-scripts = { path = "../ace-mod-scripts", optional = true }
ace-mod-urls = { path = "../ace-mod-urls", optional = true }
ace-mod-values = { path = "../ace-mod-values", optional = true }
ace-mod-xlm = { path = "../ace-mod-xlm", optional = true }
ace-mod-yara = { path = "../ace-mod-yara", optional = true }
ace-results = { path = "../ace-results" }
ace-sdk = { path = "../ace-sdk" }
# The Landlock maintainers' own bindings.
landlock = "0.4.7"
libc = "0.2.191"
# Span export (PLAN.md 2.22): OTLP over HTTP with reqwest's blocking client, which the batch
# processor's own thread drives.
opentelemetry = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
# Only for its types; ace-sdk's HttpClient picks reqwest's features.
reqwest = { version = "0.13.5", default-features = false }
schemars = { version = "1.2.3", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# A downloaded ruleset is checked against its key (PLAN.md 2.26).
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.34.0", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "registry"] }

[dev-dependencies]
base64 = "0.22.1"
ace-core = { path = "../ace-core", features = ["testing"] }
# PLAN.md 5.12's Done check starts a GUI command from the GUI's page and closes its session.
ace-gui = { path = "../ace-gui" }
ace-service = { path = "../ace-service" }
axum = "0.8.9"
reqwest = { version = "0.13.5", default-features = false, features = ["form"] }
flate2 = "1.1.10"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
ace-mod-xlm = { path = "../ace-mod-xlm" }
ace-mod-splunk = { path = "../ace-mod-splunk" }
# The modules of the reads of ACE's data built so far (PLAN.md 7.4), for the reads' tests.
ace-mod-brocess = { path = "../ace-mod-brocess" }
ace-mod-snort = { path = "../ace-mod-snort" }
ace-mod-nrd = { path = "../ace-mod-nrd" }
ace-pool = { path = ".", features = ["test-pools"] }
# The example resolver, which declares a secret, for the secrets test.
ace-sdk = { path = "../ace-sdk", features = ["example-modules"] }
ace-store = { path = "../ace-store" }
ace-testkit = { path = "../ace-testkit" }
form_urlencoded = "1.2.2"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio"] }
uuid = "1.29.0"

[lints]
workspace = true
