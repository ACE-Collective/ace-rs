[package]
name = "ace-pool"
version = "0.1.0"
description = "The pool runtime: lease loop, task supervisor and containment"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The test pool binary and its modules, for this crate's tests.
test-pools = ["dep:ace-mod-archive", "dep:ace-mod-email", "dep:tracing-subscriber"]

[[bin]]
name = "test-pool"
required-features = ["test-pools"]

[dependencies]
ace-mod-archive = { path = "../ace-mod-archive", optional = true }
ace-mod-email = { path = "../ace-mod-email", optional = true }
ace-results = { path = "../ace-results" }
ace-sdk = { path = "../ace-sdk" }
# The Landlock maintainers' own bindings.
landlock = "0.4.7"
libc = "0.2.191"
# Only for its types; ace-sdk's HttpClient picks reqwest's features.
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"], optional = true }

[dev-dependencies]
ace-core = { path = "../ace-core", features = ["testing"] }
ace-pool = { path = ".", features = ["test-pools"] }
ace-store = { path = "../ace-store" }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio"] }
uuid = "1.29.0"

[lints]
workspace = true
