[package]
name = "ace-pools"
version = "0.1.0"
description = "The open-source pool binaries: the parser pool and the network pool"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ace-parsers"
path = "src/bin/ace-parsers.rs"

[[bin]]
name = "ace-lookups"
path = "src/bin/ace-lookups.rs"

[dependencies]
ace-mod-archive = { path = "../ace-mod-archive" }
ace-mod-email = { path = "../ace-mod-email" }
ace-mod-rdap = { path = "../ace-mod-rdap" }
ace-mod-splunk = { path = "../ace-mod-splunk" }
ace-mod-yara = { path = "../ace-mod-yara" }
ace-pool = { path = "../ace-pool" }
ace-sdk = { path = "../ace-sdk" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["fs", "macros", "rt-multi-thread", "signal", "time"] }
tokio-util = "0.7.20"
tracing = "0.1.44"

[lints]
workspace = true
