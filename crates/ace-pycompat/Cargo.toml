[package]
name = "ace-pycompat"
version = "0.1.0"
description = "Python 3.14 behaviour that ported code needs: str, unicodedata, urllib.parse, html, base64, ipaddress, json, csv, the idna codec, and the idna, validators and tld packages"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
memchr = "2.8.3"
regex = "1.13.1"

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[lints]
workspace = true
