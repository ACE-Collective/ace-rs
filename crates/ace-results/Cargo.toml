[package]
name = "ace-results"
version = "0.1.0"
description = "Observable kinds, result types, the analysis type registry and JSON Schema export"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std"] }
# Without default features it never fetches a $ref over the network.
jsonschema = { version = "0.60.2", default-features = false }
schemars = { version = "1.2.3", features = ["chrono04"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
insta = { version = "1.49.0", features = ["json"] }
tempfile = "3.27.0"

[lints]
workspace = true
