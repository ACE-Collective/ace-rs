[package]
name = "ace-sdk"
version = "0.1.0"
description = "What an analysis module is built on: the module traits, manifests, task context, HTTP client and file output"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The example modules, for this crate's tests and ace-testkit's.
example-modules = []

[dependencies]
ace-results = { path = "../ace-results" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
# rustls with aws-lc-rs, verifying against the platform's roots.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json"] }
# Only to recognize rustls's errors when classifying; reqwest picks the TLS setup.
rustls = { version = "0.23", default-features = false }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt", "time"] }
tokio-util = "0.7.20"
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
rcgen = "0.14.10"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util", "net"] }
tokio-rustls = "0.26.6"

[lints]
workspace = true
