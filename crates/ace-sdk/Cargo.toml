[package]
name = "ace-sdk"
version = "0.1.0"
description = "What an analysis module is built on: the module traits, manifests, task context, HTTP client and file output"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The example modules, for this crate's tests and ace-testkit's.
example-modules = []

[dependencies]
ace-results = { path = "../ace-results" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
# rustls with aws-lc-rs, verifying against the platform's roots.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json"] }
# The newly registered domains list's names, encoded as Python's idna package encodes them (nrd.rs).
idna = "1.1.0"
unicode-general-category = "1.1.0"
unicode-normalization = "0.1.26"
# The public suffix list itself is bundled in src/, as tldextract bundles it in ace3 (domains.rs).
publicsuffix = { version = "2.3.0", default-features = false }
# An analyst-edited list's patterns (PLAN.md 5.14), whose matching is linear in the input.
regex = "1.13.1"
# Only to recognize rustls's errors when classifying; reqwest picks the TLS setup.
rustls = { version = "0.23", default-features = false }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1.0.154"
# The site overlay (PLAN.md 2.23): serde_yaml's maintained fork.
serde_norway = "0.9.42"
serde_path_to_error = "0.1.20"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt", "time"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["serde", "v4"] }

[dev-dependencies]
# The integration tests use the example modules.
ace-sdk = { path = ".", features = ["example-modules"] }
rcgen = "0.14.10"
tokio ={ version = "1.54.1", features = ["io-util", "net"] }
tokio-rustls = "0.26.6"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[lints]
workspace = true
