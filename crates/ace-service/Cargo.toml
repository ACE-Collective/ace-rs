[package]
name = "ace-service"
version = "0.1.0"
description = "The service layer: who is acting, what they may do, and the writes that record it"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Its tests are tests/service.rs, so the crate adds one test binary (PLAN.md 2.33).
[lib]
test = false
doctest = false

[dependencies]
ace-core = { path = "../ace-core" }
ace-results = { path = "../ace-results" }
# The analyst-edited lists' entries, checked as a module will compile them (PLAN.md 5.14).
ace-sdk = { path = "../ace-sdk" }
argon2 = "0.6.0"
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde", "clock"] }
# A user's timezone is checked against the IANA names.
chrono-tz = "0.10.4"
getrandom = "0.4.3"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# A GUI command line splits as a shell would, as ace3's `shlex.split` does (PLAN.md 5.12).
shlex = "2.0.1"
# Queries are checked against the migrated schema at build time, as in ace-core.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "macros", "uuid", "json", "chrono"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync"] }
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["serde", "v4"] }

[dev-dependencies]
ace-core = { path = "../ace-core", features = ["testing"] }
ace-sdk = { path = "../ace-sdk" }
ace-store = { path = "../ace-store" }
regex = "1.13.1"
schemars = "1.2.3"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
# SVS validation's workers and replays stop on a cancel (PLAN.md 7.10 batch 3).
tokio-util = "0.7.20"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[lints]
workspace = true
