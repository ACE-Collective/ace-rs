[package]
name = "ace-site-example"
version = "0.1.0"
description = "An example site crate: binaries built through ace-app with two modules and one observable type of the site's own"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A site repository depends on these by git tag (PLAN.md 2.32); this one uses paths, and only
# the crates' public items.
[dependencies]
ace = { path = "../ace" }
ace-app = { path = "../ace-app" }
# The ticket lookup's analysis view (PLAN.md 5.9).
ace-gui = { path = "../ace-gui" }
askama = "0.16.1"
ace-results = { path = "../ace-results" }
ace-sdk = { path = "../ace-sdk" }
# The example integration's alert router (PLAN.md 7.13).
ace-service = { path = "../ace-service" }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[[bin]]
name = "example-ace"
path = "src/bin/example-ace.rs"

[[bin]]
name = "example-lookups"
path = "src/bin/example-lookups.rs"

[[bin]]
name = "example-parsers"
path = "src/bin/example-parsers.rs"

[dev-dependencies]
# The request a parser pool's supervisor writes its task process, which the task process test
# writes by hand.
ace-pool = { path = "../ace-pool" }
# A routed alert's time, in the alert routing test (PLAN.md 7.13).
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# A database of the test's own, which the site's `ace serve` runs on.
ace-core = { path = "../ace-core", features = ["testing"] }
libc = "0.2.191"
# A site module's run with the facts a lease carries (the event time test).
ace-testkit = { path = "../ace-testkit" }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
sqlx = { version = "0.9.0", default-features = false, features = ["json", "postgres", "runtime-tokio", "uuid"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
uuid = "1.29.0"

[lints]
workspace = true
