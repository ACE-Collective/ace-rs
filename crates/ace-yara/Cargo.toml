[package]
name = "ace-yara"
version = "0.1.0"
description = "ACE's two YARA scanner layers, yara_scanner_v2's and ACE's own, on yara-x"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
magic = "0.17.0"
regex = "1.13.1"
rustix = { version = "1.1.6", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
tracing = "0.1.44"
yara-x = "1.22.1"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }

[lints]
workspace = true
