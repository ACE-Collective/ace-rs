[package]
name = "ace"
version = "0.1.0"
description = "The ace binary: CLI, API, GUI, orchestrator, scheduler"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ace"
path = "src/main.rs"

[dependencies]
ace-yara = { path = "../ace-yara" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[lints]
workspace = true
