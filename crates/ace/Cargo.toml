[package]
name = "ace"
version = "0.1.0"
description = "The open-source binaries over ace-app: ace, and the ace-parsers, ace-lookups and ace-python pools"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The SVS build: `ace yara replay` also reports the slowest rules (ace-app's svs feature).
# `cargo tree -e features -i yara-x -p ace --features svs` shows rules-profiling.
svs = ["ace-app/svs"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "ace"
path = "src/main.rs"

[[bin]]
name = "ace-parsers"
path = "src/bin/ace-parsers.rs"

[[bin]]
name = "ace-lookups"
path = "src/bin/ace-lookups.rs"

[[bin]]
name = "ace-python"
path = "src/bin/ace-python.rs"

[dependencies]
ace-app = { path = "../ace-app" }
ace-mod-archive = { path = "../ace-mod-archive" }
ace-mod-email = { path = "../ace-mod-email" }
ace-mod-msoffice = { path = "../ace-mod-msoffice" }
ace-mod-oletools = { path = "../ace-mod-oletools" }
ace-mod-pdf = { path = "../ace-mod-pdf" }
ace-mod-python = { path = "../ace-mod-python" }
ace-mod-rdap = { path = "../ace-mod-rdap" }
ace-mod-splunk = { path = "../ace-mod-splunk" }
ace-mod-yara = { path = "../ace-mod-yara" }

[lints]
workspace = true
