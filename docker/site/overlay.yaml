# The site overlay the Compose stack's ace, parsers and lookups services read (PLAN.md 2.23),
# mounted at /etc/ace4/overlay.yaml from ACE4_SITE (this directory by default). With no
# sections, every module runs as itself on its defaults. A site sets its modules' settings, its
# named instances, where its secrets come from, the core's scheduled tasks and hooks, and its
# alert dispositions and what each means for detection verdicts (ace_sdk::overlay lists the
# sections). The end-to-end test's overlay, tests/e2e/site/overlay.yaml (2.30), is an example.
#
# The dispositions are ace3's (rank, css, show_save_to_event, analyst_selectable) unless a site
# changes them. Each entry is merged over ace3's, so a site names only what it changes, and a new
# disposition needs a rank and a css. css is the badge's class, `disposition-<css>`: up to 64 letters,
# digits, - and _. The stylesheet colours primary, secondary, success, danger, warning, info, light
# and dark; any other shows as a plain badge. None can be removed: one a site no longer wants is set analyst_selectable: false, which
# takes it out of the menus and refuses it from analysts. `ace serve` refuses to start on a bad
# section. For example:
#
# dispositions:
#   INSIDER_THREAT: {rank: 140, css: danger, show_save_to_event: true}
#   UNKNOWN: {analyst_selectable: false}
# disposition_classification:
#   INSIDER_THREAT: tp
#
# The AI investigation API (ace_service::ai) is off unless a site turns it on. It is read-only routes
# under /api/ai/v1 for an AI agent's own API key; ACE itself calls no model. A backend is a data source
# the agent may query, of a type the binary has (splunk, or the testing backends fake and
# fake_unwindowed), with its own limits and the one secret it is given. For example:
#
# ai_api:
#   enabled: true
#   backends:
#     splunk:
#       type: splunk
#       enabled: true
#       secrets: [splunk_ai_readonly_token]
#       limits: {max_concurrency: 4, requests_per_minute: 30, hourly_budget: 400}
#       settings:
#         splunk: {host: splunk.example.com, timezone: GMT}
# secrets:
#   splunk_ai_readonly_token: env:ACE4_SPLUNK_AI_TOKEN
#
# The Splunk account behind that token has to be one whose role leaves out the commands that write
# (| delete, | outputlookup, | collect): that role, not ACE, is what makes the backend read-only. A key
# for an agent holds only ai: permissions, such as
# `ace user create-key agent --grant ai:splunk --grant ai:alert --grant ai:backends`.
modules: {}
