# Uses each thing the rules allow: an ACE_RS_ port, an ephemeral port, an ace-rs-* image
# that's built here, a volume and a network named by Compose, a mem_limit, and a one-shot
# service that needs none.
name: ${ACE_RS_STACK:-ace-rs}
services:
  web:
    build: .
    image: ace-rs-web:latest
    ports:
      - "${ACE_RS_BIND_ADDRESS:-127.0.0.1}:${ACE_RS_PORT_HTTPS:-7443}:443"
      - "${ACE_RS_BIND_ADDRESS:-127.0.0.1}::5432"
      - target: 80
        published: "${ACE_RS_PORT_HTTP:-7080}"
    volumes:
      - data:/data
    networks: [inner]
    mem_limit: 256m
  setup:
    image: alpine:3.24.2
    restart: "no"
volumes:
  data:
networks:
  inner:
