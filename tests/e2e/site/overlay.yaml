# The end-to-end test's site overlay (PLAN.md 2.30, tests/e2e/run). The RDAP module and the
# Splunk instance talk to the stack's responder service, which replays the recordings in
# tools/ace3/dumps/reference over plain HTTP on port 443, and the DNS module asks it as its
# resolver, which answers from tools/ace3/trees/dns.json, so nothing reaches the internet, a
# real resolver or a real Splunk.
# The analysis cache (PLAN.md decision 26) is off, so every sample is analyzed by its modules, not
# answered from what an earlier sample or check kept: the comparison checks the modules. tests/e2e/run's
# two-run check turns it on, for its own samples, to check that a hit is a run.
analysis_cache:
  enabled: false
# The Splunk instance (PLAN.md decision 41), named as ace3 names its instance, with ace3's secret
# name for its password.
connections:
  default:
    type: splunk
    settings:
      host: 127.0.0.1
      base_url: http://responder:443/https/127.0.0.1:8089
      username: ace4
      request_timeout_seconds: 10
    secrets:
      password: splunk_default_password
modules:
  rdap_analyzer:
    settings:
      bootstrap_url: http://responder:443/https/data.iana.org/rdap/
      request_timeout_seconds: 10
  fqdn_analyzer:
    settings:
      nameservers: ["responder:53"]
  # tools/ace3/trees/nrd.json's domains are verified by no RDAP, as make-trees runs ace3
  nrd_analyzer:
    settings:
      max_registration_age_days: 0
  # the stack has no fluent-bit; the logger's brocess writes are what the test checks
  email_logger:
    settings:
      fluent_bit_logging_enabled: false
  # tools/ace3/trees/site_tags.csv, the CSV make-trees gives ace3's site_tagger; tests/e2e/run checks
  # that each of its lines is here
  site_tagger:
    settings:
      csv: |
        url,glob,false,http://192.0.2.1:8080/*,lab_url
        fqdn,subdomain,false,pcap-http.example,pcap_lab
  # phishkit loads no URL in the test and renders only `.htm` files: the comparison's samples have URLs
  # other modules mark to crawl, which are on the internet, and HTML bodies of emails that become alerts,
  # and ace3's trees have no phishkit, since make-trees doesn't enable it, as it would load those URLs.
  # Every URL a scanner loads has "://" in it, and no sample is a `.htm` file. tests/e2e/run's
  # check_scanners renders a `.htm` page through it in correlation mode.
  phishkit_analyzer:
    settings:
      deny_crawl_url_patterns: ["://"]
      valid_file_extensions: [".htm"]
      valid_mime_types: []
  splunk_api:
    instances:
      # in ace3's correlation group, so a root that becomes an alert runs it, as make-trees
      # runs ace3's instance of the same name
      proxy_domain_splunk:
        inputs: [fqdn]
        groups: [correlation]
        connections: {splunk: default}
        settings:
          question: Was this domain seen in proxy logs?
          summary: Proxy correlation
          query: index=proxy hostname="<O_VALUE>"
          observable_mapping:
            - {field: user, type: email_address}
# The core's hooks (PLAN.md 7.6). tools/ace3/trees/make-trees gives ace3 the same: it enables
# configuration_defined_tagging, which ace3 ships disabled, over ace3's own `tags:` section, which these
# tags are, and writes these rules into ace3's observable modifier rules file with ace3's names for the
# modules they name (its MODULE_PATHS).
hooks:
  configuration_defined_tagging:
    tags:
      {high_fp_frequency: special, whitelisted: special, encrypted_email: special,
       decrypted_email: special, tracked: special, debug: fp, qualys: fp, infosec: fp, p2p: fp,
       frequent_conversation: fp, guest_wireless: fp, pentester: fp, new_sender: interesting,
       hunt_validation: interesting, warning: warning, executive: warning, treasury: warning,
       suspicious_url: warning, suspect: warning, olevba: warning, officeparser_failed: warning,
       rtf_binary: warning, unexpected_binary_data: warning, microsoft_script_encoding: warning,
       office365_block: alert, pos: alert, phish: alert, apt: alert, av: alert, dc: alert,
       malicious_url: alert, malicious: alert, ssdeep: alert, rat: alert, script_in_zip: alert,
       exe_in_zip: alert, one_in_zip: alert, lnk_in_zip: alert, suspect_ole_attachment: alert,
       critical: critical, needs_research: critical, denied: detail, proxied: alert, observed: alert,
       analysis_too_large: detail}
  observable_modifier:
    rules:
      # post: walks the fqdn's ancestors to the email and reads a list in its details
      - name: e2e recipient domain
        uuid: 2f0c8a9e-6b0d-4c55-9a51-0e1d2c3b4a01
        conditions:
          observable_types: [fqdn]
          value_pattern: '^example\.net$'
          tree_conditions:
            - analysis_type: email_analyzer
              details_match: {email.to_addresses: '^bob@example\.net$'}
        actions:
          add_tags: [modifier_recipient_domain]
          add_detection_points: [the observable modifier marked a recipient's domain]
          set_display_type: Recipient Domain
          set_display_value: recipient
      # pre: keeps RDAP off an fqdn before it's queued
      - name: no rdap for example.net
        uuid: 2f0c8a9e-6b0d-4c55-9a51-0e1d2c3b4a02
        phase: pre
        conditions: {observable_types: [fqdn], value_pattern: '^example\.net$'}
        actions: {exclude_analysis: [rdap_analyzer], add_directives: [modifier_pre]}
      # post: takes a hash out from under the module that added it
      - name: hashes out from under the hash module
        uuid: 2f0c8a9e-6b0d-4c55-9a51-0e1d2c3b4a03
        conditions:
          observable_types: [md5]
          tree_conditions: [{analysis_type: file_hash_analyzer, scope: parent}]
        actions: {ignore: true}
      # pre: an ignore keeps everything off what it matches
      - name: no subject analysis
        uuid: 2f0c8a9e-6b0d-4c55-9a51-0e1d2c3b4a04
        phase: pre
        conditions: {observable_types: [email_subject]}
        actions: {ignore: true}
# The AI investigation API (PLAN.md 7.15) isn't here: `ace serve-ai` reads ai.yaml, beside this file.
secrets:
  splunk_default_password: env:ACE4_SPLUNK_PASSWORD
