# ace4's clicker detection fixture (PLAN.md 7.4): searches written for these tests, in the form of
# ace3's etc/clicker_detection.yaml, against made-up indexes that tools/ace3/dumps/fake_splunk.py
# answers from fixtures/splunk/clicker_rows.json.
splunk:
  enabled: true
  searches:
    url_clicks:
      observable_types: [url, fqdn]
      query: |
        index=ace4_clicks sourcetype="ace4:click" Url=<O_VALUE> <TIMESPEC>
        | table Timestamp AccountUpn ActionType Url NetworkMessageId
      time_ranges: { TIMESPEC: { duration_before: "07:00:00:00", duration_after: "00:01:00:00" } }
      use_index_time: false
      observable_mapping:
        - { field: AccountUpn, type: email_address, display_type: Clicker }
      event_mapping: { timestamp: Timestamp, user: AccountUpn, action_type: ActionType, url: Url, network_message_id: NetworkMessageId }
      on_hit: { escalate_action_types: [ClickAllowed], add_detection_point: true, crawl_clicked_url: true }
    proxy:
      observable_types: [url, fqdn]
      query: |
        index=ace4_proxy <O_VALUE> <TIMESPEC>
        ```one comment the web link leaves out```
        | table _time user url
      time_ranges: { TIMESPEC: { duration_before: "01:00:00:00", duration_after: "00:01:00:00" } }
      use_index_time: true
      match_url_encoded: true
      observable_mapping:
        - { field: user, type: email_address, display_type: Clicker }
      event_mapping: { timestamp: _time, user: user, url: url }
      on_hit: { escalate_on_any: true, add_detection_point: true, crawl_clicked_url: true }
    domains_only:
      observable_types: [fqdn]
      query: index=ace4_dns query=<O_VALUE> <TIMESPEC>
      time_ranges: { TIMESPEC: "00:12:00:00" }
      event_mapping: { timestamp: _time }
      on_hit: {}
    for_addresses:
      observable_types: [ipv4]
      query: index=ace4_never <O_VALUE>
