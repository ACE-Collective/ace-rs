include:
  - includes/defaults.include.yaml
rule:
  uuid: 00000000-0000-0000-0000-00000000a006
  name: named time ranges
  description: TIMESPEC tokens over index time, in an app's namespace, in another timezone
  splunk_config: eastern
  splunk_app_context: security
  splunk_user_context: hunter
  use_index_time: true
  time_ranges:
    TIMESPEC:
      duration_before: "00:15:00"
    TIMESPEC_WIDE:
      duration_before: "01:00:00:00"
  query: |
    index=auth ace4case=timespec <TIMESPEC> [ search index=assets <TIMESPEC_WIDE> | fields host ]
  observable_mapping:
    - field: host
      type: hostname
